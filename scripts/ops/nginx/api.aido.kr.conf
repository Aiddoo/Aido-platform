# /etc/nginx/sites-available/api.aido.kr 의 정본이다. 설치와 인증서: apps/api/docs/deployment.md "서버 설정".
# "managed by Certbot" 줄은 certbot이 관리한다. 지우거나 옮기지 않는다.

upstream aido_api {
    # scripts/deploy.sh가 살아 있는 슬롯 한 줄(blue 8080 또는 green 8081)을 쓴다
    include /etc/nginx/aido-api-upstream.inc;
}

# 앱의 요청 제한이 본 한도다. 여기서는 한 IP가 서버를 독차지하는 것만 막는다(통신사 NAT는 IP를 나눠 쓴다)
limit_req_zone $binary_remote_addr zone=aido_api_ip:10m rate=50r/s;

# 다른 Host·SNI로 온 요청은 응답 없이 끊는다
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_reject_handshake on;
    # SNI만 맞추고 Host를 다르게 보낸 요청은 handshake 뒤에 여기로 온다
    return 444;
}

server {
    listen 80;
    listen [::]:80;
    server_name api.aido.kr;
    server_tokens off;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name api.aido.kr;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/api.aido.kr/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/api.aido.kr/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

    limit_req_status 429;

    location / {
        limit_req zone=aido_api_ip burst=100 nodelay;

        proxy_pass http://aido_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # 앱은 이 한 홉만 믿는다(trust proxy 1)
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
