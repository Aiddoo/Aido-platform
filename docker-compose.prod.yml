services:
  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: migrate
    container_name: aido-prod-migrate
    env_file:
      - .env.docker.prod
    restart: "no"
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: production
    container_name: aido-prod-api
    ports:
      - "${PORT:-8080}:8080"
    environment:
      TZ: Asia/Seoul
    env_file:
      - .env.docker.prod
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1"
        reservations:
          memory: 128M
          cpus: "0.25"
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
