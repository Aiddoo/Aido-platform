# 테스트는 이 훅에서 turbo로 실행해 결과를 팀 원격 캐시에 올리고, CI가 그 캐시를 재사용한다(docs/conventions/git.md#커밋).
# https://lefthook.dev/configuration/

glob_matcher: doublestar

pre-commit:
  piped: true
  jobs:
    # 수정 도구가 먼저 staged 파일을 고치고 다시 stage한 뒤 검사가 그 결과를 본다.
    - name: oxlint
      glob: '**/*.{js,jsx,ts,tsx,mjs,cjs,mts,cts}'
      run: pnpm exec oxlint --fix {staged_files}
      stage_fixed: true
    - name: oxfmt
      glob: '**/*.{js,jsx,ts,tsx,mjs,cjs,mts,cts,json,jsonc,json5,css,scss,md,mdx,yaml,yml,toml}'
      run: pnpm exec oxfmt --write --no-error-on-unmatched-pattern {staged_files}
      stage_fixed: true
    - name: ci-policy
      glob: 'scripts/ci/*.mjs'
      run: node --test scripts/ci/*.test.mjs
    # 코드 파일 이름이 바뀌어도 문서 경로가 깨지므로 glob 없이 커밋마다 전체 문서를 본다(1초 안).
    - name: docs-check
      run: node scripts/docs/docs-check.mjs
    - name: docs-check-test
      glob: 'scripts/docs/*.mjs'
      run: node --test scripts/docs/*.test.mjs
    # 폴더·파일 이름은 전체를 보되 몇 초 안에 끝난다. 코드 관례는 위 oxlint(aido 플러그인)가 본다.
    - name: ls-lint
      glob: '{apps/api/src/**/*.ts,packages/api/src/**,apps/mobile/src/features/**,apps/mobile/src/shared/ui/**,apps/mobile/app/**,.ls-lint.yml}'
      run: pnpm exec ls-lint

# 커밋마다 전체 검사를 돌리면 작은 커밋이 수 분씩 걸려 push 때 한 번 모아 돌린다.
# 코드가 바뀐 push만 돈다(문서만 바뀌면 건너뜀). 동시 실행 2가 속도와 CPU 부하의 균형점이다(2026-11 측정).
# 통합·계약 테스트는 DB 컨테이너를 하나씩 띄우고 로컬 Docker가 필요하다(Testcontainers).
pre-push:
  piped: true
  skip:
    - merge
    - rebase
  jobs:
    - name: typecheck-test-build
      glob: &code-files
        - '{apps,packages,tooling,turbo}/**/*.{ts,tsx,mts,cts,js,jsx,mjs,cjs,json,jsonc,sql}'
        - '{package.json,pnpm-lock.yaml,pnpm-workspace.yaml,turbo.json,.nvmrc}'
        - 'patches/**'
        - 'apps/api/docs/alerts.md'
      run: pnpm turbo run typecheck test test:node build --concurrency=2
    - name: integration-contract
      glob: *code-files
      run: pnpm turbo run test:integration test:contract --filter=@aido/server --concurrency=1
    # 생성 결과는 커밋된 HEAD를 임시 worktree에 만들어 본다(약 1분). 템플릿을 바꾼 push만 돈다.
    - name: generator-smoke
      glob: 'turbo/generators/**'
      run: pnpm test:generator

commit-msg:
  jobs:
    - name: commitlint
      run: pnpm exec commitlint --edit {1}
