# Docker 개발 환경 (PostgreSQL + API)
# 사용: pnpm docker:dev:up
# DB는 로컬 Docker 컨테이너, API는 DATABASE_URL로 연결
services:
  db:
    image: postgres:16-alpine
    ports:
      - '${DB_PORT:-5433}:5432'
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: aido
    volumes:
      - dev_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d aido']
      interval: 5s
      timeout: 5s
      retries: 5

  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: migrate
    env_file:
      - ${AIDO_DEV_ENV_FILE:-.env.docker.dev}
    environment:
      JOB_SCHEMA: ${JOB_SCHEMA:-pgboss}
    depends_on:
      db:
        condition: service_healthy
    restart: 'no'
    logging:
      driver: json-file
      options:
        max-size: '20m'
        max-file: '5'

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: development
    ports:
      - '${API_HOST_PORT:-8080}:8080'
    environment:
      TZ: Asia/Seoul
      JOB_BACKEND: ${JOB_BACKEND:-postgres}
      JOB_SCHEMA: ${JOB_SCHEMA:-pgboss}
      JOB_REDIS_DRAIN_ENABLED: 'false'
      CACHE_TYPE: memory
    env_file:
      - ${AIDO_DEV_ENV_FILE:-.env.docker.dev}
    volumes:
      - ./apps/api/src:/app/apps/api/src
      - ./apps/api/prisma:/app/apps/api/prisma
      - ./packages/errors/src:/app/packages/errors/src
      - ./packages/utils/src:/app/packages/utils/src
      - ./packages/validators/src:/app/packages/validators/src
    healthcheck:
      test:
        ['CMD-SHELL', 'wget --no-verbose --tries=1 --spider http://localhost:8080/health || exit 1']
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  dev_postgres_data:
