# 로컬 개발. env는 API와 같은 apps/api/.env.development를 읽는다
# DB만: pnpm docker:up (API는 pnpm dev) · DB → migrate → API 모두: pnpm docker:dev:up
# Redis는 CACHE_TYPE=redis를 시험할 때만: docker compose --profile redis up -d
services:
  db:
    image: postgres:16.15-alpine
    ports:
      - '${DB_PORT:-5433}:5432'
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: aido
    volumes:
      - dev_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d aido']
      interval: 5s
      timeout: 5s
      retries: 5

  migrate:
    profiles: [api]
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: migrate
    env_file:
      - apps/api/.env.development
    environment:
      # 컨테이너 안에서는 compose 네트워크의 db로 붙는다(.env.development는 호스트 기준 localhost)
      DATABASE_URL: postgresql://postgres:postgres@db:5432/aido
    depends_on:
      db:
        condition: service_healthy
    restart: 'no'
    logging:
      driver: json-file
      options:
        max-size: '20m'
        max-file: '5'

  api:
    profiles: [api]
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: development
    ports:
      - '${API_HOST_PORT:-8080}:8080'
    env_file:
      - apps/api/.env.development
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/aido
    volumes:
      - ./apps/api/src:/app/apps/api/src
      - ./apps/api/drizzle:/app/apps/api/drizzle
      - ./packages/api/src:/app/packages/api/src
    healthcheck:
      test:
        ['CMD-SHELL', 'wget --no-verbose --tries=1 --spider http://localhost:8080/health || exit 1']
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    depends_on:
      migrate:
        condition: service_completed_successfully

  redis:
    profiles: [redis]
    image: redis:7.4-alpine
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  dev_postgres_data:
