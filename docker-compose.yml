# 로컬 개발용 인프라 (DB only)
# API는 네이티브 실행: pnpm dev

services:
  db:
    image: postgres:16-alpine
    container_name: aido-db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: aido
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d aido"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
