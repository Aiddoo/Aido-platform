name: CI

on:
  workflow_dispatch:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}
  DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup

      - name: Biome Check
        run: pnpm turbo run check --affected

      - name: Type Check
        run: pnpm turbo run typecheck --affected

  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup

      - name: Run unit tests
        run: pnpm turbo run test --affected

      - name: Run integration tests
        run: pnpm turbo run test:integration --filter=@aido/api

      - name: Run E2E tests
        env:
          JWT_SECRET: test-jwt-secret-for-ci-minimum-32-characters-long
          JWT_REFRESH_SECRET: test-jwt-refresh-secret-for-ci-min-32-chars
          JWT_EXPIRES_IN: 15m
          JWT_REFRESH_EXPIRES_IN: 7d
          EMAIL_FROM: noreply@test.aido.app
          EMAIL_FROM_NAME: Aido Test
          TOKEN_ENCRYPTION_KEY: test-token-encryption-key-for-ci-minimum-32-chars
          NODE_ENV: test
        run: pnpm turbo run test:e2e --filter=@aido/api

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup

      - name: Build
        run: pnpm turbo run build --filter='!@aido/mobile'
