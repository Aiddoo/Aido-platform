name: CI

# main을 향한 PR과 main push에서만 돈다. stack은 맨 아래 PR만 main을 향하고, 위층의 누적 tree는
# tip push의 pre-push가 검증한다. 합친 뒤 main push가 이미지 발행 전에 다시 검증한다(docs/conventions/git.md#stack).
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

# PR은 새 push가 옛 run을 취소한다. main은 진행 중인 run을 끝까지 돌려 이미지 발행이 끊기지 않게 한다.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  scope:
    name: CI Scope
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read # 마지막으로 이미지를 발행한 CI run 조회
    outputs:
      api: ${{ steps.scope.outputs.api }}
      mobile: ${{ steps.scope.outputs.mobile }}
      shared: ${{ steps.scope.outputs.shared }}
      docs: ${{ steps.scope.outputs.docs }}
    steps:
      # 변경 파일 목록만 필요하므로 blob 없이 이력과 tree만 받는다.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none

      # main push는 직전 push(event.before)가 아니라 마지막으로 이미지를 발행한 CI 커밋부터 비교한다.
      # 앞선 run이 대기 중 밀려 취소되거나 실패해 이미지를 못 만들었으면 그 API 변경을 이번 run이 다시 담는다.
      - name: Resolve last image commit
        id: base
        if: github.event_name == 'push'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { owner, repo } = context.repo;
            const { data } = await github.rest.actions.listWorkflowRuns({
              owner, repo, workflow_id: 'ci.yml', branch: 'main', status: 'success', per_page: 100,
            });
            for (const run of data.workflow_runs) {
              const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
                owner, repo, run_id: run.id, per_page: 100,
              });
              if (jobs.some((job) => job.name === 'Build & Push Image' && job.conclusion === 'success')) {
                core.setOutput('sha', run.head_sha);
                return;
              }
            }
            core.warning('최근 main CI 100회에 이미지 발행이 없어 전체 범위로 검증한다');

      - name: Resolve changed scope
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || steps.base.outputs.sha }}
        run: node scripts/ci/dependency-scope.mjs "$BASE_SHA" "$GITHUB_SHA" | tee -a "$GITHUB_OUTPUT"

  dependency-review:
    name: Dependency Review
    needs: scope
    if: github.event_name == 'pull_request' && (needs.scope.outputs.api == 'true' || needs.scope.outputs.mobile == 'true' || needs.scope.outputs.shared == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

  # 로컬 pre-push가 같은 팀 Turbo 원격 캐시에 올린 단위·통합 테스트 결과를 재사용하고, 놓친 작업만 러너에서 실제로 돈다.
  # 통합 테스트(Testcontainers)는 GitHub 러너의 Docker로 돈다. 전체 E2E는 로컬에서만 돌리고 PR 본문에 기록한다(docs/conventions/git.md#커밋).
  # 정적 검사·테스트·API 빌드를 한 job에 두어 checkout·의존성 설치를 한 번만 한다.
  verify:
    name: Lint, Test & Build
    needs: scope
    if: needs.scope.outputs.api == 'true' || needs.scope.outputs.mobile == 'true' || needs.scope.outputs.shared == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
      # --affected의 비교 기준은 PR base다. main push는 얕은 checkout이라 전체를 변경으로 보고 캐시가 걸러 준다.
      TURBO_SCM_BASE: ${{ github.event.pull_request.base.sha || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Changeset 검사가 PR base부터의 변경 패키지를 계산한다. 이력은 PR에서만 받고 blob은 필요할 때만 받는다.
          # 표현식에서 숫자 0은 거짓이라 `&& 0 || 1`은 항상 1이 된다. 문자열로 비교한다.
          fetch-depth: ${{ github.event_name == 'pull_request' && '0' || '1' }}
          filter: ${{ github.event_name == 'pull_request' && 'blob:none' || '' }}

      - uses: ./.github/actions/setup
        with:
          install-scope: ${{ needs.scope.outputs.mobile == 'true' && 'all' || 'api' }}

      # Oxc는 전체 저장소를 한 번 스캔한다. 패키지별 프로세스를 반복하지 않아 로컬·CI 결과가 같다.
      - name: Oxlint
        run: pnpm lint

      - name: Oxfmt Check
        run: pnpm format:check

      # 문서의 상대 링크·앵커·저장소 경로·길이·에이전트 파일 모양을 본다(docs/conventions/docs.md).
      - name: Docs check
        run: pnpm docs:check

      # 위험을 수용한 advisory는 pnpm-workspace.yaml auditConfig.ignoreGhsas에서 관리한다.
      - name: Dependency audit
        run: pnpm audit --prod --audit-level high

      # 서버·공유 계약을 바꾼 PR은 Changesets 변경 파일을 함께 올린다(docs/conventions/git.md#버전).
      # 모바일은 스토어 버전이라 Changesets에서 제외되어 있어 이 검사에 걸리지 않는다.
      # 릴리스 PR은 `pnpm version-packages`가 변경 파일을 CHANGELOG로 소비하므로 CHANGELOG 변경으로 대신 확인한다.
      - name: Changeset
        if: github.event_name == 'pull_request' && (needs.scope.outputs.api == 'true' || needs.scope.outputs.shared == 'true')
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if git diff --name-only "$BASE_SHA" HEAD | grep -q 'CHANGELOG\.md$'; then
            echo "버전을 확정한 릴리스 PR이다. 변경 파일은 CHANGELOG로 반영됐다."
            exit 0
          fi
          pnpm changeset status --since="$BASE_SHA"

      # 코드 관례는 Oxlint 단계(aido JS 플러그인)가 본다. 여기서는 파일 이름(ls-lint)과 import 경계(dependency-cruiser)를 본다.
      # 모바일 의존성이 없는 API 범위에서는 서버만 돈다.
      - name: Names & Dependencies
        if: needs.scope.outputs.api == 'true' || needs.scope.outputs.mobile == 'true'
        run: pnpm lint:names && pnpm turbo run lint:deps --affected ${{ needs.scope.outputs.mobile != 'true' && '--filter=@aido/server' || needs.scope.outputs.api != 'true' && '--filter=@aido/mobile' || '' }}

      - name: Type Check
        if: needs.scope.outputs.api == 'true' || needs.scope.outputs.mobile == 'true'
        run: pnpm turbo run typecheck --affected ${{ needs.scope.outputs.mobile != 'true' && '--filter=@aido/server' || needs.scope.outputs.api != 'true' && '--filter=@aido/mobile' || '' }}

      # 테스트 러너마다 코어 비율로 worker를 잡아 겹치면 4 vCPU 러너를 과포화시키므로 테스트 작업은 한 번에 하나씩 돈다.
      # 계약 테스트(출시 앱 OpenAPI 지문)는 배포 전 하위 호환 확인이라 main에서도 돈다. pre-push가 올린 캐시가 있으면 재사용한다.
      - name: Test
        if: needs.scope.outputs.api == 'true' || needs.scope.outputs.mobile == 'true'
        run: pnpm turbo run test test:node test:integration test:contract --affected --concurrency=1 ${{ needs.scope.outputs.mobile != 'true' && '--filter=@aido/server' || needs.scope.outputs.api != 'true' && '--filter=@aido/mobile' || '' }}

      - name: Build API and dependency closure
        if: needs.scope.outputs.api == 'true'
        run: pnpm turbo run build --affected --filter='!@aido/mobile'

  # 문서만 바뀐 diff는 verify 범위가 비어 건너뛰므로 루트 도구(remark)만 설치해 문서 검사만 돈다.
  docs:
    name: Docs Check
    needs: scope
    if: needs.scope.outputs.docs == 'true' && needs.scope.outputs.api != 'true' && needs.scope.outputs.mobile != 'true' && needs.scope.outputs.shared != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup
        with:
          install-scope: root

      - name: Docs check
        run: pnpm docs:check

  # main 전용: 프로덕션 이미지를 arm64 러너에서 빌드해 GHCR로 push.
  # 같은 run의 검증이 성공한 뒤에만 이미지를 발행한다. API 영향이 없는 main 변경은 건너뛴다. 서버는 pull만 한다 (scripts/deploy.sh).
  # job 이름 'Build & Push Image'는 deploy.yml과 위 scope가 이미지 발행 여부를 찾는 기준이다. 바꾸면 함께 바꾼다.
  docker:
    name: Build & Push Image
    needs: [scope, verify]
    if: needs.scope.outputs.api == 'true' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04-arm # arm64 표준 러너 (private 레포 지원, 플랜 무료 분수 사용)
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # 검사를 통과한 이미지만 GHCR에 올린다. deploy는 두 이미지가 모두 있는 SHA만 배포한다.
      - name: Build api image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/api/Dockerfile
          target: production
          platforms: linux/arm64
          load: true
          push: false
          pull: true # node:26.13.0-alpine3.24의 최신 base 보안 digest 수급
          provenance: false # 단일 아키 이미지는 plain manifest 유지 (서버 pull 단순화)
          tags: ghcr.io/aiddoo/aido-platform-api:${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

      - name: Scan api image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/aiddoo/aido-platform-api:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: Build migrate image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/api/Dockerfile
          target: migrate
          platforms: linux/arm64
          load: true
          push: false
          pull: true # node:26.13.0-alpine3.24의 최신 base 보안 digest 수급
          provenance: false
          tags: ghcr.io/aiddoo/aido-platform-migrate:${{ github.sha }}
          cache-from: type=gha,scope=migrate
          cache-to: type=gha,scope=migrate,mode=max

      - name: Scan migrate image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/aiddoo/aido-platform-migrate:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      # GHCR 쓰기 로그인은 서드파티 스캔이 끝난 뒤 push 바로 앞에서만 한다(빌드·스캔에는 필요 없다).
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push images
        id: push
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          for image in api migrate; do
            ref="ghcr.io/aiddoo/aido-platform-$image:$IMAGE_TAG"
            docker push "$ref"
            echo "${image}_digest=$(docker buildx imagetools inspect "$ref" --format '{{.Manifest.Digest}}')" >> "$GITHUB_OUTPUT"
          done

      # 출처 증명은 GitHub attestations API에만 저장한다. registry에 올리면 GHCR 버전이 늘어 아래 보존 개수를 잠식한다.
      # 검증: gh attestation verify oci://ghcr.io/aiddoo/aido-platform-api:<sha> --repo Aiddoo/Aido-platform
      - name: Attest api image provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/aiddoo/aido-platform-api
          subject-digest: ${{ steps.push.outputs.api_digest }}

      - name: Attest migrate image provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/aiddoo/aido-platform-migrate
          subject-digest: ${{ steps.push.outputs.migrate_digest }}

      # sha 태그 누적 방지 — 각 패키지 최신 10개만 유지
      - name: Prune old api image versions
        uses: actions/delete-package-versions@e5bc658cc4c965c472efe991f8beea3981499c55 # v5.0.0
        with:
          package-name: aido-platform-api
          package-type: container
          min-versions-to-keep: 10

      - name: Prune old migrate image versions
        uses: actions/delete-package-versions@e5bc658cc4c965c472efe991f8beea3981499c55 # v5.0.0
        with:
          package-name: aido-platform-migrate
          package-type: container
          min-versions-to-keep: 10
