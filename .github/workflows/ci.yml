name: CI

on:
  workflow_dispatch:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}
  DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup

      # PR: --affected로 변경된 패키지만 / push(main·develop): 전체 실행 — 배포 게이트
      # (main 푸시는 로컬 main == HEAD라 --affected diff가 빈 집합이 되어 검증이 스킵되는 버그가 있었음)
      - name: Biome Check
        run: pnpm turbo run check ${{ github.event_name == 'pull_request' && '--affected' || '' }}

      - name: Type Check
        run: pnpm turbo run typecheck ${{ github.event_name == 'pull_request' && '--affected' || '' }}

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup

      # 각 테스트 출력을 파일로 남기고 실패 시 아티팩트 업로드 — 플레이크 재현용
      # (jest-e2e는 showSeed로 랜덤 시드가 로그에 남으므로 --seed로 고정 재현 가능)
      - name: Run unit tests
        run: pnpm turbo run test ${{ github.event_name == 'pull_request' && '--affected' || '' }} 2>&1 | tee /tmp/test-unit.log

      # 통합/E2E 태스크는 @aido/api에만 존재 → PR에서 --affected만으로 자연 스코프됨
      # (모바일/문서-only PR은 Testcontainers 스킵, api 영향 변경은 실행)
      - name: Run integration tests
        run: pnpm turbo run test:integration ${{ github.event_name == 'pull_request' && '--affected' || '--filter=@aido/api' }} 2>&1 | tee /tmp/test-integration.log

      - name: Run E2E tests
        env:
          JWT_SECRET: test-jwt-secret-for-ci-minimum-32-characters-long
          JWT_REFRESH_SECRET: test-jwt-refresh-secret-for-ci-min-32-chars
          JWT_EXPIRES_IN: 15m
          JWT_REFRESH_EXPIRES_IN: 7d
          EMAIL_FROM: noreply@test.aido.app
          EMAIL_FROM_NAME: Aido Test
          TOKEN_ENCRYPTION_KEY: test-token-encryption-key-for-ci-minimum-32-chars
          NODE_ENV: test
        run: pnpm turbo run test:e2e ${{ github.event_name == 'pull_request' && '--affected' || '--filter=@aido/api' }} 2>&1 | tee /tmp/test-e2e.log

      - name: Upload test logs (failure only)
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-logs-${{ github.run_id }}
          path: /tmp/test-*.log
          retention-days: 14

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup

      - name: Build
        run: pnpm turbo run build --filter='!@aido/mobile'
