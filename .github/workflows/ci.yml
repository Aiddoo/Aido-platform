name: CI

on:
  workflow_dispatch:
  push:
    branches: [main, develop]
  pull_request:
    types:
      [
        opened,
        synchronize,
        reopened,
        ready_for_review,
        converted_to_draft,
        labeled,
        unlabeled,
        edited,
      ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: >-
    ${{ github.event_name != 'pull_request' || (github.event.action != 'edited' && github.event.action != 'labeled' && github.event.action != 'unlabeled') || github.event.changes.base != null || startsWith(github.event.label.name, 'stack:') || github.event.label.name == 'ci:stack-tip' }}

defaults:
  run:
    shell: bash # GitHub가 -eo pipefail을 적용하므로 tee 뒤에서도 테스트 실패가 보존된다.

permissions:
  contents: read
  pull-requests: read

env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}
  DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder

jobs:
  gate:
    name: CI Scope
    if: >-
      ${{ (github.event_name != 'pull_request' || (github.event.action != 'edited' && github.event.action != 'labeled' && github.event.action != 'unlabeled') || github.event.changes.base != null || startsWith(github.event.label.name, 'stack:') || github.event.label.name == 'ci:stack-tip') && (github.event_name != 'pull_request' || (!github.event.pull_request.draft && (!contains(join(github.event.pull_request.labels.*.name, ','), 'stack:') || contains(github.event.pull_request.labels.*.name, 'ci:stack-tip')))) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.policy.outputs.run }}
      api: ${{ steps.policy.outputs.api }}
      mobile: ${{ steps.policy.outputs.mobile }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # GitHub 공식 Octokit 클라이언트가 인증·pagination을 맡는다.
      # 저장소 고유의 스택/의존성 정책만 별도 모듈로 유지한다.
      - name: Resolve cumulative CI scope
        id: policy
        uses: actions/github-script@373c709c69115d41ff229c7e5df9f8788daa9553 # v9.0.0 (Node 24)
        with:
          script: |
            const { execFileSync } = require('node:child_process');
            const { readdirSync } = require('node:fs');
            const tests = readdirSync('scripts/ci').filter((file) => file.endsWith('.test.mjs'));
            execFileSync(process.execPath, ['--test', ...tests.map((file) => `scripts/ci/${file}`)], { stdio: 'inherit' });
            const { planPullRequestCI } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/ci/stack-policy.mjs`);
            const { dependencyScope } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/ci/dependency-scope.mjs`);
            const { owner, repo } = context.repo;
            const event = context.payload;
            let plan = { run: true, base: 'develop', reason: 'push-or-dispatch', ancestors: [] };
            let baseSha = '';
            let headSha = context.sha;
            if (event.pull_request !== undefined) {
              const { data: current } = await github.rest.pulls.get({ owner, repo, pull_number: event.pull_request.number });
              headSha = current.head.sha;
              if (headSha !== event.pull_request.head.sha) throw new Error('The workflow head is stale; rerun for the current commit.');
              const openPulls = await github.paginate(github.rest.pulls.list, { owner, repo, state: 'open', per_page: 100 });
              plan = planPullRequestCI(current, openPulls, `${owner}/${repo}`);
              const verifyAncestor = async (base) => {
                const { data } = await github.rest.repos.compareCommits({ owner, repo, base, head: headSha });
                if (!['ahead', 'identical'].includes(data.status)) throw new Error('Rebase the CI tip to include the current base and all stack ancestors.');
              };
              if (plan.run) {
                const { data: branch } = await github.rest.repos.getBranch({ owner, repo, branch: plan.base });
                baseSha = branch.commit.sha;
                if (plan.reason === 'cumulative-stack-tip') await verifyAncestor(baseSha);
              }
              for (const ancestor of plan.ancestors) await verifyAncestor(ancestor);
            }
            let paths = null;
            if (plan.run && context.eventName !== 'workflow_dispatch') {
              try {
                const baseline = baseSha || event.before;
                if (baseline === undefined || baseline === '' || /^0+$/.test(baseline)) throw new Error('No complete diff baseline');
                const range = event.pull_request !== undefined ? `${baseline}...${headSha}` : `${baseline}..${headSha}`;
                paths = execFileSync('git', ['diff', '--name-only', '-z', range], { encoding: 'utf8' }).split('\0').filter((path) => path !== '');
              } catch (error) {
                core.warning(`Unable to scope changed files; running all checks: ${error.message}`);
              }
            }
            const scope = dependencyScope(paths);
            core.setOutput('run', plan.run);
            core.setOutput('api', scope.api);
            core.setOutput('mobile', scope.mobile);
            await core.summary.addRaw(`CI policy: **${plan.reason}**. API=${scope.api}, mobile=${scope.mobile}, shared=${scope.shared}. Heavy checks: **${plan.run ? 'run' : 'deferred'}**. Base: ${plan.base} (${baseSha}). Head: ${headSha}. Ancestors: ${plan.ancestors.join(', ') || 'none'}.`).write();

  lint:
    name: Lint & Type Check
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup
        with:
          generate-prisma: ${{ needs.gate.outputs.api }}
          install-scope: ${{ needs.gate.outputs.mobile == 'true' && 'all' || 'api' }}

      # Oxc는 전체 저장소를 한 번 스캔한다. 패키지별 프로세스를 반복하지 않아 로컬·CI 결과가 같다.
      - name: Oxlint
        run: pnpm lint

      - name: Oxfmt Check
        run: pnpm format:check

      - name: Type Check
        if: needs.gate.outputs.api == 'true' || needs.gate.outputs.mobile == 'true'
        run: pnpm turbo run typecheck ${{ needs.gate.outputs.mobile != 'true' && '--filter=@aido/api' || needs.gate.outputs.api != 'true' && '--filter=@aido/mobile' || '' }}

      - name: Mobile conventions
        if: needs.gate.outputs.mobile == 'true'
        run: pnpm --filter @aido/mobile check:conventions

  test-unit:
    name: Test - Unit & Coverage
    needs: gate
    if: needs.gate.outputs.run == 'true' && (needs.gate.outputs.api == 'true' || needs.gate.outputs.mobile == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup
        with:
          generate-prisma: ${{ needs.gate.outputs.api }}
          install-scope: ${{ needs.gate.outputs.mobile == 'true' && 'all' || 'api' }}

      # 각 테스트 출력을 파일로 남기고 실패 시 아티팩트 업로드 — 플레이크 재현용
      #
      # api는 아래 커버리지 스텝이 같은 유닛 스위트를 돌리므로 여기서 제외한다.
      # (예전에는 양쪽에서 돌아 2600여 건이 매 CI마다 두 번 실행됐다.)
      - name: Run unit tests
        if: needs.gate.outputs.mobile == 'true'
        run: pnpm turbo run test --filter='!@aido/api' 2>&1 | tee /tmp/test-unit.log

      # gate에서 누적 의존성 범위를 결정하고 Turbo는 입력 해시로 검증 결과를 재사용한다.
      - name: Run API unit tests with coverage
        if: needs.gate.outputs.api == 'true'
        run: pnpm turbo run test:cov --filter=@aido/api 2>&1 | tee /tmp/test-coverage.log

      - name: Upload unit test logs (failure only)
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-unit-logs-${{ github.run_id }}
          path: /tmp/test-*.log
          retention-days: 14

  test-integration:
    name: Test - Integration
    needs: gate
    if: needs.gate.outputs.run == 'true' && needs.gate.outputs.api == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup
        with:
          generate-prisma: ${{ needs.gate.outputs.api }}
          install-scope: api

      # gate에서 API 영향이 없는 변경은 러너 자체를 건너뛴다.
      - name: Run integration tests
        run: pnpm turbo run test:integration --filter=@aido/api 2>&1 | tee /tmp/test-integration.log

      - name: Upload integration test logs (failure only)
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-integration-logs-${{ github.run_id }}
          path: /tmp/test-integration.log
          retention-days: 14

  test-e2e:
    name: Test - E2E
    needs: gate
    if: needs.gate.outputs.run == 'true' && needs.gate.outputs.api == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup
        with:
          generate-prisma: ${{ needs.gate.outputs.api }}
          install-scope: api

      - name: Run E2E tests
        env:
          JWT_SECRET: test-jwt-secret-for-ci-minimum-32-characters-long
          JWT_REFRESH_SECRET: test-jwt-refresh-secret-for-ci-min-32-chars
          JWT_EXPIRES_IN: 15m
          JWT_REFRESH_EXPIRES_IN: 7d
          EMAIL_FROM: noreply@test.aido.app
          EMAIL_FROM_NAME: Aido Test
          TOKEN_ENCRYPTION_KEY: test-token-encryption-key-for-ci-minimum-32-chars
          NODE_ENV: test
        run: pnpm turbo run test:e2e --filter=@aido/api 2>&1 | tee /tmp/test-e2e.log

      - name: Upload E2E test logs (failure only)
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-e2e-logs-${{ github.run_id }}
          path: /tmp/test-e2e.log
          retention-days: 14

  build:
    name: Build
    needs: gate
    if: needs.gate.outputs.run == 'true' && needs.gate.outputs.api == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup
        with:
          generate-prisma: ${{ needs.gate.outputs.api }}
          install-scope: api

      - name: Build
        run: pnpm turbo run build --filter='!@aido/mobile'

  # main 전용: 프로덕션 이미지를 arm64 러너에서 빌드해 GHCR로 push.
  # 필수 검증 성공 뒤에만 이미지를 발행한다. API 영향이 없는 main 변경은 건너뛴다. 서버는 pull만 한다 (scripts/deploy.sh).
  docker:
    name: Build & Push Image
    needs: [gate, lint, test-unit, test-integration, test-e2e, build]
    if: needs.gate.outputs.api == 'true' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04-arm # arm64 표준 러너 (private 레포 지원, 플랜 무료 분수 사용)
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push api image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/api/Dockerfile
          target: production
          platforms: linux/arm64
          push: true
          pull: true # node:24.21.0-alpine3.24의 최신 base 보안 digest 수급
          provenance: false # 단일 아키 이미지는 plain manifest 유지 (서버 pull 단순화)
          tags: ghcr.io/aiddoo/aido-platform-api:${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

      - name: Build & push migrate image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/api/Dockerfile
          target: migrate
          platforms: linux/arm64
          push: true
          pull: true # node:24.21.0-alpine3.24의 최신 base 보안 digest 수급
          provenance: false
          tags: ghcr.io/aiddoo/aido-platform-migrate:${{ github.sha }}
          cache-from: type=gha,scope=migrate
          cache-to: type=gha,scope=migrate,mode=max

      # sha 태그 누적 방지 — 각 패키지 최신 10개만 유지
      - name: Prune old api image versions
        uses: actions/delete-package-versions@e5bc658cc4c965c472efe991f8beea3981499c55 # v5.0.0
        with:
          package-name: aido-platform-api
          package-type: container
          min-versions-to-keep: 10

      - name: Prune old migrate image versions
        uses: actions/delete-package-versions@e5bc658cc4c965c472efe991f8beea3981499c55 # v5.0.0
        with:
          package-name: aido-platform-migrate
          package-type: container
          min-versions-to-keep: 10
