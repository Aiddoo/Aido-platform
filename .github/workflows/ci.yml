name: CI

on:
  workflow_dispatch:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}
  DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder

jobs:
  # 릴리스 PR(develop→main, head=develop) 스킵: 같은 커밋의 push 런이 전체 검증을
  # 이미 수행하고(develop↔main은 릴리스마다 ff-sync로 동기) 그 체크가 동일 SHA로 PR에
  # 표시된다 — 이중 실행(러너 분수·Testcontainers)과 머지 시 취소(✗) 노이즈 제거.
  lint:
    name: Lint & Type Check
    if: github.event_name != 'pull_request' || github.event.pull_request.head.ref != 'develop'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup

      # PR: --affected로 변경된 패키지만 / push(main·develop): 전체 실행 — 배포 게이트
      # (main 푸시는 로컬 main == HEAD라 --affected diff가 빈 집합이 되어 검증이 스킵되는 버그가 있었음)
      - name: Biome Check
        run: pnpm turbo run check ${{ github.event_name == 'pull_request' && '--affected' || '' }}

      - name: Type Check
        run: pnpm turbo run typecheck ${{ github.event_name == 'pull_request' && '--affected' || '' }}

      # DDD strict-core 게이트 (불변 계약 + exact baseline + dependency 경계 + as 단언 금지) — 태스크가 api에만
      # 존재해 PR --affected로 자연 스코프. 배포가 CI 성공에 게이트되므로 릴리스 차단 게이트.
      - name: Architecture gates
        run: pnpm turbo run lint:arch ${{ github.event_name == 'pull_request' && '--affected' || '--filter=@aido/api' }}

  test-unit:
    name: Test - Unit & Coverage
    if: github.event_name != 'pull_request' || github.event.pull_request.head.ref != 'develop'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup

      - name: Verify test log failure propagation
        run: bash scripts/ci/run-with-tee.spec.sh

      # 각 테스트 출력을 파일로 남기고 실패 시 아티팩트 업로드 — 플레이크 재현용
      - name: Run unit tests
        run: scripts/ci/run-with-tee.sh /tmp/test-unit.log pnpm turbo run test ${{ github.event_name == 'pull_request' && '--affected' || '' }}

      - name: Run API coverage
        run: scripts/ci/run-with-tee.sh /tmp/test-coverage.log pnpm --filter @aido/api test:cov

      - name: Upload unit test logs (failure only)
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-unit-logs-${{ github.run_id }}
          path: /tmp/test-*.log
          retention-days: 14

  test-integration:
    name: Test - Integration
    if: github.event_name != 'pull_request' || github.event.pull_request.head.ref != 'develop'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup

      # 통합/E2E 태스크는 @aido/api에만 존재 → PR에서 --affected만으로 자연 스코프됨
      # (모바일/문서-only PR은 Testcontainers 스킵, api 영향 변경은 실행)
      - name: Run integration tests
        run: scripts/ci/run-with-tee.sh /tmp/test-integration.log pnpm turbo run test:integration ${{ github.event_name == 'pull_request' && '--affected' || '--filter=@aido/api' }}

      - name: Upload integration test logs (failure only)
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-integration-logs-${{ github.run_id }}
          path: /tmp/test-integration.log
          retention-days: 14

  test-e2e:
    name: Test - E2E
    if: github.event_name != 'pull_request' || github.event.pull_request.head.ref != 'develop'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup

      - name: Run E2E tests
        env:
          JWT_SECRET: test-jwt-secret-for-ci-minimum-32-characters-long
          JWT_REFRESH_SECRET: test-jwt-refresh-secret-for-ci-min-32-chars
          JWT_EXPIRES_IN: 15m
          JWT_REFRESH_EXPIRES_IN: 7d
          EMAIL_FROM: noreply@test.aido.app
          EMAIL_FROM_NAME: Aido Test
          TOKEN_ENCRYPTION_KEY: test-token-encryption-key-for-ci-minimum-32-chars
          NODE_ENV: test
        run: scripts/ci/run-with-tee.sh /tmp/test-e2e.log pnpm turbo run test:e2e ${{ github.event_name == 'pull_request' && '--affected' || '--filter=@aido/api' }}

      - name: Upload E2E test logs (failure only)
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-e2e-logs-${{ github.run_id }}
          path: /tmp/test-e2e.log
          retention-days: 14

  build:
    name: Build
    if: github.event_name != 'pull_request' || github.event.pull_request.head.ref != 'develop'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup

      - name: Build
        run: pnpm turbo run build --filter='!@aido/mobile'

  # main 전용: 프로덕션 이미지를 arm64 러너에서 빌드해 GHCR로 push.
  # 테스트 job들과 병렬로 돌고, workflow_run(Deploy)은 CI 전체 성공 시에만 발화하므로
  # 배포 시작 시점에 이미지 존재가 보장된다. 서버는 pull만 한다 (scripts/deploy.sh).
  docker:
    name: Build & Push Image
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04-arm # arm64 표준 러너 (private 레포 지원, 플랜 무료 분수 사용)
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push api image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: apps/api/Dockerfile
          target: production
          platforms: linux/arm64
          push: true
          pull: true # base 이미지(node:22-alpine) 최신 digest 확인 — 보안 패치 자동 수급
          provenance: false # 단일 아키 이미지는 plain manifest 유지 (서버 pull 단순화)
          tags: ghcr.io/aiddoo/aido-platform-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push migrate image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: apps/api/Dockerfile
          target: migrate
          platforms: linux/arm64
          push: true
          pull: true # base 이미지(node:22-alpine) 최신 digest 확인 — 보안 패치 자동 수급
          provenance: false
          tags: ghcr.io/aiddoo/aido-platform-migrate:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # sha 태그 누적 방지 — 각 패키지 최신 10개만 유지
      - name: Prune old api image versions
        uses: actions/delete-package-versions@e5bc658cc4c965c472efe991f8beea3981499c55 # v5.0.0
        with:
          package-name: aido-platform-api
          package-type: container
          min-versions-to-keep: 10

      - name: Prune old migrate image versions
        uses: actions/delete-package-versions@e5bc658cc4c965c472efe991f8beea3981499c55 # v5.0.0
        with:
          package-name: aido-platform-migrate
          package-type: container
          min-versions-to-keep: 10
