name: Deploy to EC2

on:
  workflow_run:
    workflows: ['CI']
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      sha:
        description: '배포할 커밋 SHA (비우면 이미지가 발행된 main의 최신 CI 성공 커밋)'
        required: false
        default: ''
      force:
        description: '이전 커밋으로의 배포 허용 (수동 롤백용)'
        type: boolean
        default: false

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  actions: read
  packages: read # GHCR 이미지 pull (서버로 임시 GITHUB_TOKEN 전달 — 런 종료 시 자동 만료)

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 25
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'

    steps:
      # 공식 Octokit pagination으로 이미지가 실제 발행된 CI run만 선택한다.
      - name: Resolve deploy SHA
        id: sha
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          INPUT_SHA: ${{ inputs.sha }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const hasImages = async (runId) => {
              const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
                owner, repo, run_id: runId, per_page: 100,
              });
              return jobs.some((job) => job.name === 'Build & Push Image' && job.conclusion === 'success');
            };
            let sha;
            if (context.eventName === 'workflow_run') {
              const run = context.payload.workflow_run;
              if (!(await hasImages(run.id))) {
                await core.summary.addRaw('API image job was skipped; no production deployment.').write();
                return;
              }
              sha = run.head_sha;
            } else if (process.env.INPUT_SHA !== '') {
              sha = process.env.INPUT_SHA;
            } else {
              for await (const response of github.paginate.iterator(github.rest.actions.listWorkflowRuns, {
                owner, repo, workflow_id: 'ci.yml', branch: 'main', status: 'success', per_page: 100,
              })) {
                for (const run of response.data.workflow_runs) {
                  if (await hasImages(run.id)) {
                    sha = run.head_sha;
                    break;
                  }
                }
                if (sha !== undefined) break;
              }
            }
            if (sha === undefined || !/^[0-9a-f]{40}$/.test(sha)) {
              throw new Error('A full commit SHA with a successful image build is required.');
            }
            core.setOutput('sha', sha);
            core.info(`배포 대상 SHA: ${sha}`);

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: steps.sha.outputs.sha != ''
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # manifest만 읽는다. 이미지를 내려받거나 SSH에 연결하기 전에 두 태그를 확인한다.
      - name: Verify both image SHA tags
        if: steps.sha.outputs.sha != ''
        env:
          DEPLOY_SHA: ${{ steps.sha.outputs.sha }}
        run: |
          docker buildx imagetools inspect "ghcr.io/aiddoo/aido-platform-api:$DEPLOY_SHA" >/dev/null
          docker buildx imagetools inspect "ghcr.io/aiddoo/aido-platform-migrate:$DEPLOY_SHA" >/dev/null

      - name: Deploy via SSH
        if: steps.sha.outputs.sha != ''
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        env:
          DEPLOY_SHA: ${{ steps.sha.outputs.sha }}
          FORCE_DEPLOY: ${{ (github.event_name == 'workflow_dispatch' && inputs.force) && '1' || '0' }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          command_timeout: 20m
          envs: DEPLOY_SHA,FORCE_DEPLOY,GHCR_TOKEN
          script: |
            set -euo pipefail
            mkdir -p "$HOME/apps/deploy-state"
            exec 9>"$HOME/apps/deploy-state/deploy.lock"
            flock -n 9 || { echo "다른 배포가 진행 중 — 중단"; exit 1; }
            export DEPLOY_LOCK_HELD=1
            cd "$HOME/apps/Aido-platform"
            git fetch origin main
            git rev-parse --verify "${DEPLOY_SHA}^{commit}" >/dev/null
            git merge-base --is-ancestor "$DEPLOY_SHA" origin/main \
              || { echo "::error::DEPLOY_SHA가 origin/main 이력에 없습니다"; exit 1; }
            git reset --hard "$DEPLOY_SHA"
            [[ -f scripts/deploy.sh ]] \
              || { echo "::error::scripts/deploy.sh 없음 — 스크립트 포함 커밋 이후로만 배포 가능"; exit 1; }
            bash scripts/deploy.sh

      - name: Verify public health endpoint
        if: steps.sha.outputs.sha != ''
        run: |
          sleep 5
          curl -fsS --retry 6 --retry-delay 10 --retry-all-errors --max-time 10 \
            https://api.aido.kr/health
