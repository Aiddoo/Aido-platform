name: Deploy to EC2

on:
  workflow_run:
    workflows: ['CI']
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      sha:
        description: '배포할 커밋 SHA (비우면 이미지가 발행된 main의 최신 CI 성공 커밋)'
        required: false
        default: ''
      force:
        description: '이전 커밋으로의 배포 허용 (수동 롤백용)'
        type: boolean
        default: false

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions: {}

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # workflow_run의 branches 필터는 head 브랜치 이름만 본다. 같은 저장소 main push/dispatch로 끝난 CI만 배포한다.
    if: >-
      ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && contains(fromJSON('["push","workflow_dispatch"]'), github.event.workflow_run.event) && github.event.workflow_run.head_repository.full_name == github.repository) }}
    permissions:
      actions: read # CI run·job 조회
      packages: read # GHCR 이미지 pull (서버로 임시 GITHUB_TOKEN 전달 — 런 종료 시 자동 만료)

    steps:
      # 공식 Octokit pagination으로 이미지가 실제 발행된 CI run만 선택한다.
      - name: Resolve deploy SHA
        id: sha
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          INPUT_SHA: ${{ inputs.sha }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const hasImages = async (runId) => {
              const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
                owner, repo, run_id: runId, per_page: 100,
              });
              return jobs.some((job) => job.name === 'Build & Push Image' && job.conclusion === 'success');
            };
            let sha;
            if (context.eventName === 'workflow_run') {
              const run = context.payload.workflow_run;
              if (!(await hasImages(run.id))) {
                await core.summary.addRaw('API image job was skipped; no production deployment.').write();
                return;
              }
              sha = run.head_sha;
            } else if (process.env.INPUT_SHA !== '') {
              sha = process.env.INPUT_SHA;
            } else {
              for await (const response of github.paginate.iterator(github.rest.actions.listWorkflowRuns, {
                owner, repo, workflow_id: 'ci.yml', branch: 'main', status: 'success', per_page: 100,
              })) {
                for (const run of response.data.workflow_runs) {
                  if (await hasImages(run.id)) {
                    sha = run.head_sha;
                    break;
                  }
                }
                if (sha !== undefined) break;
              }
            }
            if (sha === undefined || !/^[0-9a-f]{40}$/.test(sha)) {
              throw new Error('A full commit SHA with a successful image build is required.');
            }
            core.setOutput('sha', sha);
            core.info(`배포 대상 SHA: ${sha}`);

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        if: steps.sha.outputs.sha != ''
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # manifest만 읽는다. 이미지를 내려받거나 SSH에 연결하기 전에 두 태그를 확인한다.
      - name: Verify both image SHA tags
        if: steps.sha.outputs.sha != ''
        env:
          DEPLOY_SHA: ${{ steps.sha.outputs.sha }}
        run: |
          docker buildx imagetools inspect "ghcr.io/aiddoo/aido-platform-api:$DEPLOY_SHA" >/dev/null
          docker buildx imagetools inspect "ghcr.io/aiddoo/aido-platform-migrate:$DEPLOY_SHA" >/dev/null

      # 러너에 기본으로 있는 OpenSSH로 접속한다. host key는 서버 공개 키(EC2_SSH_HOST_KEYS)로 고정해 가짜 서버를 막고,
      # 토큰은 ssh 명령 인자가 아니라 stdin 스크립트로만 넘겨 서버 프로세스 목록에 보이지 않게 한다.
      - name: Deploy via SSH
        if: steps.sha.outputs.sha != ''
        timeout-minutes: 20
        shell: bash
        env:
          DEPLOY_SHA: ${{ steps.sha.outputs.sha }}
          FORCE_DEPLOY: ${{ (github.event_name == 'workflow_dispatch' && inputs.force) && '1' || '0' }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          EC2_SSH_HOST_KEYS: ${{ secrets.EC2_SSH_HOST_KEYS }}
        run: |
          [[ -n "$EC2_SSH_HOST_KEYS" ]] \
            || { echo "::error::EC2_SSH_HOST_KEYS secret이 없다(apps/api/docs/deployment.md)"; exit 1; }
          ssh_dir="$RUNNER_TEMP/ssh"
          install -m 700 -d "$ssh_dir"
          (umask 077 && printf '%s\n' "$EC2_SSH_PRIVATE_KEY" > "$ssh_dir/key")
          printf '%s\n' "$EC2_SSH_HOST_KEYS" | sed "s|^|$EC2_HOST |" > "$ssh_dir/known_hosts"
          {
            printf 'DEPLOY_SHA=%q FORCE_DEPLOY=%q GHCR_TOKEN=%q\n' "$DEPLOY_SHA" "$FORCE_DEPLOY" "$GHCR_TOKEN"
            cat <<'REMOTE'
          deploy() {
            set -euo pipefail
            export DEPLOY_SHA FORCE_DEPLOY GHCR_TOKEN
            mkdir -p "$HOME/apps/deploy-state"
            exec 9>"$HOME/apps/deploy-state/deploy.lock"
            flock -n 9 || { echo "다른 배포가 진행 중 — 중단"; exit 1; }
            export DEPLOY_LOCK_HELD=1
            cd "$HOME/apps/Aido-platform"
            git fetch origin main
            git rev-parse --verify "${DEPLOY_SHA}^{commit}" >/dev/null
            git merge-base --is-ancestor "$DEPLOY_SHA" origin/main \
              || { echo "::error::DEPLOY_SHA가 origin/main 이력에 없습니다"; exit 1; }
            # Blue-Green 이전 커밋의 스크립트는 슬롯과 Nginx upstream을 모른다. 성공으로 보이지만 Nginx는 넘어가지 않는다
            git cat-file -e "$DEPLOY_SHA:scripts/ops/nginx/api.aido.kr.conf" 2>/dev/null \
              || { echo "::error::Blue-Green 이전 커밋은 배포하지 않는다(apps/api/docs/deployment.md)"; exit 1; }
            git reset --hard "$DEPLOY_SHA"
            bash scripts/deploy.sh
          }
          # 함수를 다 읽은 뒤 stdin을 끊고 실행한다. 배포 중 명령이 남은 스크립트를 읽어 가지 않게 한다
          deploy </dev/null
          REMOTE
          } | ssh -T -i "$ssh_dir/key" -o IdentitiesOnly=yes -o BatchMode=yes \
                -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$ssh_dir/known_hosts" \
                -o ServerAliveInterval=30 -o ServerAliveCountMax=4 \
                "$EC2_USER@$EC2_HOST" 'bash -s'

      - name: Verify public health endpoint
        if: steps.sha.outputs.sha != ''
        run: |
          sleep 5
          curl -fsS --retry 6 --retry-delay 10 --retry-all-errors --max-time 10 \
            https://api.aido.kr/health
