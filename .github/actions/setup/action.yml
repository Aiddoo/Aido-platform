name: Setup
description: pnpm + Node.js + dependencies + native ORM contracts

inputs:
  install-scope:
    description: Install API dependency closure or the complete workspace
    required: false
    default: all
  generate-prisma:
    description: Generate API ORM contracts only when API is affected
    required: false
    default: 'true'

runs:
  using: composite
  steps:
    # 액션 런타임 Node24 정합 + 공급망 보안 위해 SHA 핀 (버전은 주석으로 관리 — dependabot이 갱신)
    - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version-file: .nvmrc
        cache: pnpm

    - name: Install dependencies
      env:
        INSTALL_SCOPE: ${{ inputs.install-scope }}
      run: |
        if [[ "$INSTALL_SCOPE" == "api" ]]; then
          pnpm install --frozen-lockfile --filter=@aido/api... --filter=@aido/monorepo
        else
          pnpm install --frozen-lockfile
        fi
      shell: bash

    - name: Emit ORM contracts
      if: inputs.generate-prisma == 'true'
      run: pnpm turbo run contract:emit --filter=@aido/api
      shell: bash
