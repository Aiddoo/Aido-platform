name: Setup
description: pnpm + Node.js + dependencies

inputs:
  install-scope:
    description: Install API dependency closure or the complete workspace
    required: false
    default: all

runs:
  using: composite
  steps:
    # 액션 런타임 Node24 정합 + 공급망 보안 위해 SHA 핀 (버전은 주석으로 관리 — dependabot이 갱신)
    - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: .nvmrc
        cache: pnpm

    - name: Install dependencies
      env:
        INSTALL_SCOPE: ${{ inputs.install-scope }}
      run: |
        if [[ "$INSTALL_SCOPE" == "api" ]]; then
          pnpm install --frozen-lockfile --filter=@aido/server... --filter=@aido/monorepo
        else
          pnpm install --frozen-lockfile
        fi
      shell: bash
