name: Setup
description: pnpm + Node.js + dependencies + Prisma Client

inputs:
  affected-base:
    description: Branch used for the cumulative Turbo change scope
    required: false
    default: ''
  affected-base-sha:
    description: Immutable commit used for the cumulative Turbo change scope
    required: false
    default: ''

runs:
  using: composite
  steps:
    # 액션 런타임 Node24 정합 + 공급망 보안 위해 SHA 핀 (버전은 주석으로 관리 — dependabot이 갱신)
    - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version-file: .nvmrc
        cache: pnpm

    - name: Install dependencies
      run: pnpm install --frozen-lockfile
      shell: bash

    # 최종 스택 PR은 develop부터 누적 변경을 검사한다.
    - name: Set turbo affected base (PR 전용)
      if: github.event_name == 'pull_request'
      shell: bash
      env:
        BASE_REF: ${{ inputs.affected-base || github.base_ref }}
        BASE_SHA: ${{ inputs.affected-base-sha }}
      run: |
        git fetch origin "$BASE_REF"
        if [ -n "$BASE_SHA" ]; then
          git cat-file -e "$BASE_SHA^{commit}" || git fetch origin "$BASE_SHA"
          echo "TURBO_SCM_BASE=$BASE_SHA" >> "$GITHUB_ENV"
        else
          echo "TURBO_SCM_BASE=origin/$BASE_REF" >> "$GITHUB_ENV"
        fi

    - name: Generate Prisma Client
      run: pnpm db:generate
      shell: bash
