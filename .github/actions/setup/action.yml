name: Setup
description: pnpm + Node.js + dependencies

inputs:
  install-scope:
    description: Install the root tools only (root), the API dependency closure (api) or the complete workspace (all)
    required: false
    default: all

runs:
  using: composite
  steps:
    # 액션 런타임 Node24 정합 + 공급망 보안 위해 SHA 핀 (버전은 주석으로 관리 — dependabot이 갱신)
    - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: .nvmrc
        cache: pnpm

    - name: Install dependencies
      env:
        INSTALL_SCOPE: ${{ inputs.install-scope }}
      # root는 루트 도구(문서 검사)만 쓴다. postinstall이 빌드할 패키지 의존성이 없어 스크립트를 건너뛴다.
      run: |
        if [[ "$INSTALL_SCOPE" == "api" ]]; then
          pnpm install --frozen-lockfile --filter=@aido/server... --filter=@aido/monorepo
        elif [[ "$INSTALL_SCOPE" == "root" ]]; then
          pnpm install --frozen-lockfile --filter=@aido/monorepo --ignore-scripts
        else
          pnpm install --frozen-lockfile
        fi
      shell: bash
