name: ✨ 기능 요청
description: 배경, 목표, 완료 조건을 적고 필요한 추가 정보만 작성하세요.
title: '[Feature]: '
labels: ['type: feat']
body:
  - type: markdown
    attributes:
      value: |
        제목은 `[Feature]: 대상: 개선할 내용`으로 작성합니다.
        `type: feat` 라벨은 자동으로 추가됩니다. 작업 종류에 맞게 조정하고 `scope:*`, `priority:*`, `status:*`와 Assignee는 생성 후 지정합니다.

  - type: textarea
    id: problem
    attributes:
      label: 배경
      description: 어떤 대상에서 어떤 개선이 필요한지 적어주세요.
      placeholder: '예: 주간 달성 목록을 페이지로 조회해도 연도 전체 통계를 확인하고 싶습니다.'
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 목표
      description: 작업 후 기대하는 동작이나 해결할 범위를 적어주세요.
      placeholder: '예: 페이지 밖의 기록까지 포함한 연도 요약을 반환합니다.'
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: 완료 조건
      description: 완료 여부를 확인할 수 있는 조건을 적어주세요. 필요한 조건만 작성합니다.
      placeholder: '예: 실제 주간 기록으로 페이지 이동과 연도 요약을 검증합니다.'
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        ### 추가 정보 (선택)
        알고 있는 항목만 작성합니다. 재현·성능 측정·위험·배포 조건은 해당 작업에서만 추가합니다.
        확인하지 않은 결과를 검증 완료로 적지 않습니다.

  - type: dropdown
    id: assignee
    attributes:
      label: 담당자 (선택)
      description: 현재 알고 있는 담당자를 선택하세요. 실제 GitHub Assignee는 이슈 생성 후 지정합니다.
      options:
        - 미정
        - 매튜
        - 조이
    validations:
      required: false

  - type: dropdown
    id: area
    attributes:
      label: 영향 범위 (선택)
      options:
        - apps/api
        - apps/mobile
        - packages/api
        - tooling/*
        - multiple
    validations:
      required: false

  - type: dropdown
    id: priority
    attributes:
      label: 우선순위 (선택)
      description: GitHub `priority:*` 라벨 기준으로 선택해주세요.
      options:
        - 'priority: low - 있으면 좋음'
        - 'priority: medium - 사용성 개선'
        - 'priority: high - 핵심 기능'
    validations:
      required: false

  - type: dropdown
    id: size
    attributes:
      label: 예상 작업량 (선택)
      description: 구현 범위를 알고 있을 때 선택해주세요.
      options:
        - XS (1시간 이내)
        - S (반나절)
        - M (1일)
        - L (2-3일)
        - XL (1주 이상)
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: 고려한 대안 (선택)
      placeholder: 다른 해결 방법이 있다면 작성해주세요.
    validations:
      required: false

  - type: textarea
    id: references
    attributes:
      label: 참고 자료 (선택)
      description: 필요한 문서·화면 자료만 연결하고 토큰·개인정보·비공개 데이터는 제거합니다.
      placeholder: 관련 이슈, 설계 문서, 필요한 화면 자료
    validations:
      required: false
