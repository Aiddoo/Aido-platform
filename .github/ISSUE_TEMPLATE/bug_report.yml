name: 🐛 버그 리포트
description: 배경, 목표, 완료 조건을 적고 필요한 추가 정보만 작성하세요.
title: '[Bug]: '
labels: ['type: fix']
body:
  - type: markdown
    attributes:
      value: |
        제목은 `[Bug]: 대상: 해결할 내용`으로 작성합니다.
        `type: fix` 라벨은 자동으로 추가됩니다. `scope:*`, `priority:*`, `status:*`와 Assignee는 생성 후 지정합니다.

  - type: textarea
    id: description
    attributes:
      label: 배경
      description: 어떤 대상에서 어떤 문제가 발생하는지 적어주세요.
      placeholder: '예: 할 일의 시간만 수정하면 기존 시간이 유지됩니다.'
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 목표
      description: 수정 후 기대하는 동작을 적어주세요.
      placeholder: '예: 날짜를 유지하면서 새 시간으로 저장됩니다.'
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: 완료 조건
      description: 완료 여부를 확인할 수 있는 조건을 적어주세요. 필요한 조건만 작성합니다.
      placeholder: '예: 시간만 수정하는 요청과 기존 날짜·시간 수정 요청을 검증합니다.'
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        ### 추가 정보 (선택)
        알고 있는 항목만 작성합니다. 성능 측정·위험·배포 조건은 해당 작업에서만 추가합니다.
        확인하지 않은 결과를 검증 완료로 적지 않습니다.

  - type: dropdown
    id: assignee
    attributes:
      label: 담당자 (선택)
      description: 현재 알고 있는 담당자를 선택하세요. 실제 GitHub Assignee는 이슈 생성 후 지정합니다.
      options:
        - 미정
        - 매튜
        - 조이
    validations:
      required: false

  - type: dropdown
    id: area
    attributes:
      label: 영향 범위 (선택)
      options:
        - apps/api
        - apps/mobile
        - packages/api
        - tooling/*
        - multiple
    validations:
      required: false

  - type: dropdown
    id: severity
    attributes:
      label: 우선순위 (선택)
      description: GitHub `priority:*` 라벨 기준으로 선택해주세요.
      options:
        - 'priority: low - 사소한 문제'
        - 'priority: medium - 불편하지만 사용 가능'
        - 'priority: high - 주요 기능에 영향'
        - 'priority: critical - 서비스 사용 불가'
    validations:
      required: false

  - type: textarea
    id: reproduction
    attributes:
      label: 재현 방법 (선택)
      description: 직접 확인한 입력·절차·결과가 있을 때 적어주세요. 아직 재현하지 못했다면 구분해서 적습니다.
      placeholder: |
        1. 요청 입력과 실행 환경
        2. 실행 절차
        3. 실제 결과
    validations:
      required: false

  - type: textarea
    id: environment
    attributes:
      label: 환경 정보 (선택)
      placeholder: 실제 재현에 영향을 준 OS·앱·런타임 버전이나 실행 환경
      render: markdown
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: 오류 로그 (선택)
      description: 필요한 부분만 첨부하고 토큰·개인정보·비공개 데이터는 제거합니다.
      placeholder: 민감 정보를 제거한 오류 코드나 로그
      render: shell
    validations:
      required: false
