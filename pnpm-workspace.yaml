auditConfig:
  # @expo/cli(Expo 빌드 도구) 내부 node-forge(GHSA-86w9-cpqp-85rv)·zod 3.x(GHSA-mrhx-c7xc-m3w5)는 패치 버전이 없어 위험을 수용한다. @expo/cli가 패치된 버전을 받으면 제거한다.
  ignoreGhsas:
    - GHSA-86w9-cpqp-85rv
    - GHSA-mrhx-c7xc-m3w5
