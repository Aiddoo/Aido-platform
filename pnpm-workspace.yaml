packages:
  - apps/*
  - packages/*
  - tooling/*

autoInstallPeers: true
strictPeerDependencies: true
networkConcurrency: 8

minimumReleaseAge: 0
trustPolicy: no-downgrade
trustPolicyIgnoreAfter: 43200
blockExoticSubdeps: true

catalogMode: prefer
catalogPrune: true

allowBuilds:
  '@nestjs/core': true
  '@swc/core': true
  argon2: true
  esbuild: true
  '@sentry/cli': true
  '@firebase/util': false
  '@parcel/watcher': false
  '@scarf/scarf': false
  cpu-features: false
  lefthook: false
  msgpackr-extract: false
  protobufjs: false
  ssh2: false
  unrs-resolver: false
  workerd: false

overrides:
  # @firebase/firestore 4.17이 고친 버전 밖인 ~1.9.0을 요구한다. firestore가 1.13.6 이상을 받으면 지운다.
  '@grpc/grpc-js@<1.13.6': ^1.13.6
  # @nestjs/terminus의 선택 peer인 Prisma client가 autoInstallPeers로 설치되지 않게 막는다.
  '@nestjs/terminus@12.2.0>@prisma/client': '-'

packageExtensions:
  '@expo/image-utils@0.8.17':
    dependencies:
      typescript: '5.9.3'
  '@react-native-firebase/app@*':
    dependencies:
      '@expo/config-plugins': ~58.0.9

