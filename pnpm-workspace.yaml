auditConfig:
  # 빌드 도구에만 있는 권고라 위험을 수용한다. 상위 패키지가 고친 버전을 받으면 지운다.
  # - GHSA-g3hv-75wg-m249(minimatch <11.0.1): @expo/fingerprint가 기본 optimizationLevel 1로 써서 해당 없다고
  #   Expo가 밝혔다(@expo/fingerprint build/Options.js). 9·10에 백포트가 없고 11은 glob 13과 맞지 않는다.
  # - GHSA-3g3m-2fjr-6pw4(glob <=14.0.1): 13.0.7 백포트를 받아 쓴다. 권고 범위가 갱신되지 않아
  #   계속 잡히고, 남은 glob 10은 AbortSignal을 쓰지 않는 개발 도구다.
  ignoreGhsas:
    - GHSA-g3hv-75wg-m249
    - GHSA-3g3m-2fjr-6pw4
