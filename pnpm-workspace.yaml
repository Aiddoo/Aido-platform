packages:
  - apps/*
  - packages/*
  - tooling/*

autoInstallPeers: true
strictPeerDependencies: true
networkConcurrency: 8

minimumReleaseAge: 0
trustPolicy: no-downgrade
trustPolicyIgnoreAfter: 43200
blockExoticSubdeps: true

catalogMode: prefer
catalogPrune: true

allowBuilds:
  '@nestjs/core': true
  '@suites/di.nestjs': true
  '@suites/doubles.vitest': true
  '@swc/core': true
  argon2: true
  esbuild: true
  prisma: true
  '@sentry/cli': true
  '@firebase/util': false
  '@parcel/watcher': false
  '@scarf/scarf': false
  cpu-features: false
  msgpackr-extract: false
  protobufjs: false
  simple-git-hooks: false
  ssh2: false
  unrs-resolver: false
  workerd: false

overrides:
  # Prisma 내부 의존성이 다른 pg 타입을 끌어와 Pool 타입이 갈라지지 않도록 앱 드라이버 버전으로 통일한다.
  pg: 'catalog:prisma8'
  '@types/pg': 'catalog:prisma8'
  # pnpm audit --fix 결과. 상위 패키지가 패치 버전을 받으면 해당 항목을 제거한다.
  '@grpc/grpc-js@<1.13.6': ^1.13.6
  '@hono/node-server@<1.19.15': ^1.19.15
  body-parser@<2.4.0: ^2.4.0
  fast-uri@<3.1.9: ^3.1.9
  # HealthService uses native SQL; the optional generated-client health indicator is unused.
  '@nestjs/terminus@12.1.0>@prisma/client': '-'
  decode-uri-component@<=0.4.2: ^0.5.0
  hono@<4.13.7: ^4.13.7
  http-cache-semantics@<=4.2.0: ^4.3.0
  lodash@<=4.17.23: ^4.18.1
  multer@<2.5.0: ^2.5.0
  'undici@<6.29.1': ^6.29.1
  'undici@>=7.0.0 <7.30.1': ^7.30.1
  'undici@>=8.0.0 <8.12.2': ^8.12.2
  uuid@<11.1.1: ^11.1.1
  valibot@<=1.4.1: ^1.4.2

packageExtensions:
  '@expo/image-utils@0.8.17':
    dependencies:
      typescript: '5.9.3'
  '@react-native-firebase/app@*':
    dependencies:
      '@expo/config-plugins': ~58.0.9

catalog:
  '@react-native-kakao/core': 2.4.11
  '@react-native-kakao/share': 2.4.11
  '@react-native-kakao/social': 2.4.11
  '@react-native-kakao/user': 2.4.11
  '@swc/core': '1.16.20'
  '@types/node': '24.19.2'
  '@vitest/coverage-v8': '5.0.5'
  'dayjs': '1.11.23'
  'es-toolkit': '1.53.0'
  'pg-boss': '12.38.0'
  'react-native-reorderable-list': '0.18.2'
  'react-native-reserved-regions': '0.2.0'
  'ts-pattern': '5.9.2'
  'typescript': '6.0.3'
  'vite': '8.3.5'
  'vitest': '5.0.5'
  'zod': '4.6.7'

