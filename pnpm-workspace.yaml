packages:
  - apps/*
  - packages/*
  - tooling/*

autoInstallPeers: true
strictPeerDependencies: true
networkConcurrency: 8

minimumReleaseAge: 0
trustPolicy: no-downgrade
trustPolicyIgnoreAfter: 43200
blockExoticSubdeps: true

catalogMode: prefer
catalogPrune: true

allowBuilds:
  '@nestjs/core': true
  '@suites/di.nestjs': true
  '@suites/doubles.vitest': true
  '@swc/core': true
  argon2: true
  esbuild: true
  '@sentry/cli': true
  '@firebase/util': false
  '@parcel/watcher': false
  '@scarf/scarf': false
  cpu-features: false
  lefthook: false
  msgpackr-extract: false
  protobufjs: false
  ssh2: false
  unrs-resolver: false
  workerd: false

overrides:
  # pnpm audit --fix 결과. 상위 패키지가 패치 버전을 받으면 해당 항목을 제거한다.
  '@grpc/grpc-js@<1.13.6': ^1.13.6
  '@hono/node-server@<1.19.15': ^1.19.15
  body-parser@<2.4.0: ^2.4.0
  fast-uri@<3.1.9: ^3.1.9
  # @nestjs/terminus의 선택 peer인 Prisma client가 autoInstallPeers로 설치되지 않게 막는다.
  '@nestjs/terminus@12.1.0>@prisma/client': '-'
  decode-uri-component@<=0.4.2: ^0.5.0
  hono@<4.13.7: ^4.13.7
  http-cache-semantics@<=4.2.0: ^4.3.0
  lodash@<=4.17.23: ^4.18.1
  multer@<2.5.0: ^2.5.0
  node-forge@<1.4.1: ^1.4.1
  re2js@>=2.2.0 <2.8.7: ^2.8.7
  'undici@<6.29.1': ^6.29.1
  'undici@>=7.0.0 <7.30.1': ^7.30.1
  'undici@>=8.0.0 <8.12.2': ^8.12.2
  uuid@<11.1.1: ^11.1.1
  valibot@<=1.4.1: ^1.4.2

packageExtensions:
  '@expo/image-utils@0.8.17':
    dependencies:
      typescript: '5.9.3'
  '@react-native-firebase/app@*':
    dependencies:
      '@expo/config-plugins': ~58.0.9

