    .store.test.ts: kebab-case
    .ts: regex:[^\s\S]
    .tsx: regex:[^\s\S]
    .*.ts: regex:[^\s\S]
    .*.tsx: regex:[^\s\S]
    .*.*.ts: regex:[^\s\S]
    .*.*.tsx: regex:[^\s\S]
    .*.*.*.ts: regex:[^\s\S]

