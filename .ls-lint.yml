  packages/api/src:
    .gitkeep: regex:[^\s\S]

  # schemas/는 폼·route·초안·쿼리 키·기기 저장·서버와 주고받는 모양만 둔다. 모델 스키마는 domains/{entity}.model.ts다
  apps/mobile/src/features/**/schemas:
    .schema.ts: regex:.*-(?:form|params|draft|query-key|storage|request|response|payload|entry)
    .schema.test.ts: regex:.*-(?:form|params|draft|query-key|storage|request|response|payload|entry)
