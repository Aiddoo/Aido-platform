    .*.tsx: regex:[^\s\S]
    .*.*.ts: regex:[^\s\S]
    .*.*.tsx: regex:[^\s\S]

  # app/에는 route만 둔다. 화면 테스트는 src/features/{feature}/__tests__/{route}-screen.test.tsx다
  apps/mobile/app:
    .test.ts: regex:[^\s\S]
    .test.tsx: regex:[^\s\S]
    .*.test.ts: regex:[^\s\S]
    .*.test.tsx: regex:[^\s\S]

