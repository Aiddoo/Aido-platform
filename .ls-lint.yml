# 폴더·파일 이름 규칙. 파일 이름의 kebab-case는 oxlint unicorn/filename-case가 서버 전체에 건다.
# ls-lint는 규칙이 없는 다중 점 확장자(`memo.record.ts`)를 건너뛰므로 `.*.ts` 와일드카드로 막는다.
# 같은 폴더에서는 이름 있는 확장자 규칙이 와일드카드보다 먼저다. 하위 폴더는 가장 가까운 설정 하나만 따른다.
ls:
  # .gitkeep만 남은 빈 폴더를 두지 않는다. .DS_Store는 .gitignore가 막는다
  apps/api/src:
    .dir: kebab-case
    .gitkeep: regex:[^\s\S]

  # Context 폴더(modules/<context>/…)의 파일은 사전의 역할 접미사 하나를 단다. 테스트는 역할 접미사 뒤에 .spec·.integration-spec을 붙인다
