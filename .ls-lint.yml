# 서버 폴더는 모두 kebab-case이고, slice(modules/<context>/<slice>/…)의 파일은 역할 접미사가 있어야 한다.
# 접미사 없는 `.ts`는 허용하지 않는다. 파일 이름의 kebab-case는 oxlint unicorn/filename-case가 서버 전체에 건다.
ls:
  apps/api/src:
    .dir: kebab-case

  apps/api/src/modules/*/*:
    .dir: kebab-case
    .ts: regex:[^\s\S]
    .aggregate.ts: kebab-case
    .entity.ts: kebab-case
    .vo.ts: kebab-case
    .event.ts: kebab-case
    .domain-service.ts: kebab-case
    .constants.ts: kebab-case
    .use-case.ts: kebab-case
    .port.ts: kebab-case
    .read-model.ts: kebab-case
    .lock-keys.ts: kebab-case
    .log-events.ts: kebab-case
    .alerts.ts: kebab-case
    .errors.ts: kebab-case
    .messages.ts: kebab-case
    .repository.ts: kebab-case
    .reader.ts: kebab-case
    .mapper.ts: kebab-case
    .adapter.ts: kebab-case
    .wire.ts: kebab-case
    .policy.ts: regex:[a-z0-9]+(?:-[a-z0-9]+)*-outbound
    .queue.ts: kebab-case
    .processor.ts: kebab-case
    .scheduler.ts: kebab-case
    .cache.ts: kebab-case
    .keyspace.ts: kebab-case
    .event-handler.ts: kebab-case
    .controller.ts: kebab-case
    .dto.ts: kebab-case
    .guard.ts: kebab-case
    .interceptor.ts: kebab-case
    .decorator.ts: kebab-case
    .module.ts: kebab-case
    .providers.ts: kebab-case
    .public.ts: kebab-case
    .config.ts: kebab-case
    .spec.ts: kebab-case
    .integration-spec.ts: kebab-case

ignore:
  # vitest가 spec 옆에 만드는 스냅숏 폴더
  - apps/api/src/modules/*/*/**/__snapshots__
