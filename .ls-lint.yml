    .tsx: regex:[^\s\S]
    .*.ts: regex:[^\s\S]
    .*.tsx: regex:[^\s\S]
    .*.*.ts: regex:[^\s\S]
    .*.*.tsx: regex:[^\s\S]
    .*.*.*.ts: regex:[^\s\S]

