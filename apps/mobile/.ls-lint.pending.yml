# 켜기 전 모바일 이름 규칙. 경로는 저장소 루트 기준이다.
# 1.15.2 [13/32]에서 지금 위반을 ignore baseline으로 적고 루트 .ls-lint.yml로 옮긴다.
# 역할 폴더의 파일은 그 역할의 접미사를 단다. 테스트는 원본 이름 뒤 .test, 여러 모듈 흐름은 .flow.test다.
# 이름 있는 확장자 규칙이 와일드카드보다 먼저라 남은 다중 점 이름(`todo.service.ts`)은 `.*.ts`가 막는다.
ls:
  apps/mobile/src/features/**/apis:
    .api.ts: kebab-case
    .api.test.ts: kebab-case
    .mapper.ts: kebab-case
    .mapper.test.ts: kebab-case
    .flow.test.ts: kebab-case
    .flow.test.tsx: kebab-case
    .ts: regex:[^\s\S]
    .tsx: regex:[^\s\S]
    .*.ts: regex:[^\s\S]
    .*.tsx: regex:[^\s\S]
    .*.*.ts: regex:[^\s\S]
    .*.*.tsx: regex:[^\s\S]
    .*.*.*.ts: regex:[^\s\S]

  apps/mobile/src/features/**/services:
    .service.ts: kebab-case
    .service.test.ts: kebab-case
    .session.ts: kebab-case
    .session.test.ts: kebab-case
    .flow.test.ts: kebab-case
    .flow.test.tsx: kebab-case
    .ts: regex:[^\s\S]
    .tsx: regex:[^\s\S]
    .*.ts: regex:[^\s\S]
    .*.tsx: regex:[^\s\S]
    .*.*.ts: regex:[^\s\S]
    .*.*.tsx: regex:[^\s\S]
    .*.*.*.ts: regex:[^\s\S]

  apps/mobile/src/features/**/repositories:
    .repository.ts: kebab-case
    .repository.test.ts: kebab-case
    .ts: regex:[^\s\S]
    .tsx: regex:[^\s\S]
    .*.ts: regex:[^\s\S]
    .*.tsx: regex:[^\s\S]
    .*.*.ts: regex:[^\s\S]
    .*.*.tsx: regex:[^\s\S]
    .*.*.*.ts: regex:[^\s\S]

  apps/mobile/src/features/**/stores:
    .store.ts: kebab-case
    .store.test.ts: kebab-case
    .ts: regex:[^\s\S]
    .tsx: regex:[^\s\S]
    .*.ts: regex:[^\s\S]
    .*.tsx: regex:[^\s\S]
    .*.*.ts: regex:[^\s\S]
    .*.*.tsx: regex:[^\s\S]
    .*.*.*.ts: regex:[^\s\S]

  apps/mobile/src/features/**/queries:
    .ts: regex:[a-z0-9-]+-(?:query-keys|mutation-keys|cache)
    .test.ts: regex:[a-z0-9-]+-(?:query-keys|mutation-keys|cache)
    .test.tsx: regex:[a-z0-9-]+-cache
    .queries.ts: kebab-case
    .queries.test.ts: kebab-case
    .queries.test.tsx: kebab-case
    .mutations.ts: kebab-case
    .mutations.test.ts: kebab-case
    .mutations.test.tsx: kebab-case
    .flow.test.ts: kebab-case
    .flow.test.tsx: kebab-case
    .tsx: regex:[^\s\S]
    .*.ts: regex:[^\s\S]
    .*.tsx: regex:[^\s\S]
    .*.*.ts: regex:[^\s\S]
    .*.*.tsx: regex:[^\s\S]
    .*.*.*.ts: regex:[^\s\S]

  apps/mobile/src/features/**/hooks:
    .ts: regex:use-[a-z0-9]+(?:-[a-z0-9]+)*
    .tsx: regex:use-[a-z0-9]+(?:-[a-z0-9]+)*
    .test.ts: regex:use-[a-z0-9]+(?:-[a-z0-9]+)*
    .test.tsx: regex:use-[a-z0-9]+(?:-[a-z0-9]+)*
    .android.ts: regex:use-[a-z0-9]+(?:-[a-z0-9]+)*
    .android.test.ts: regex:use-[a-z0-9]+(?:-[a-z0-9]+)*
    .ios.ts: regex:use-[a-z0-9]+(?:-[a-z0-9]+)*
    .flow.test.tsx: kebab-case
    .*.ts: regex:[^\s\S]
    .*.tsx: regex:[^\s\S]
    .*.*.ts: regex:[^\s\S]
    .*.*.tsx: regex:[^\s\S]

  # app/에는 route만 둔다. 화면 테스트는 src/features/{feature}/__tests__/{route}-screen.test.tsx다
  apps/mobile/app:
    .test.ts: regex:[^\s\S]
    .test.tsx: regex:[^\s\S]
    .*.test.ts: regex:[^\s\S]
    .*.test.tsx: regex:[^\s\S]
