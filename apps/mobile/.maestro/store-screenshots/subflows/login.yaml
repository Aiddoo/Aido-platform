appId: ${MAESTRO_APP_ID}
name: 첫 진입에서 이메일 로그인 후 홈으로 이동한다
---
# Given: Docker 개발 서버에서 인증된 임시 계정
- runFlow:
    when:
      visible: '.*RevenueCat.*|.*captureMessage.*'
    commands:
      - tapOn:
          point: '94%, 93%'
- runFlow:
    when:
      visible:
        id: login-email-entry
    commands:
      - tapOn:
          id: login-email-entry
# When: 이메일과 비밀번호를 입력하고 로그인한다
- tapOn:
    id: email-login-email
- eraseText: 100
- inputText: ${QA_EMAIL}
- tapOn:
    id: email-login-password
- eraseText: 100
- inputText: ${QA_PASSWORD}
- hideKeyboard
- waitForAnimationToEnd:
    timeout: 5000
- tapOn:
    id: email-login-submit
- extendedWaitUntil:
    visible: '지금 안 함|Not Now|마이|Me|Register your location to see the weather|위치를 등록하면 날씨를 볼 수 있어요'
    timeout: 20000
- runFlow:
    when:
      visible: '지금 안 함|Not Now'
    commands:
      - tapOn: '지금 안 함|Not Now'
# 새로 켠 기기에서는 알림 안내와 새로운 기능 소개가 피드를 덮는다. 닫고 나서 홈을 확인한다
- extendedWaitUntil:
    visible:
      id: push-onboarding-screen
    timeout: 5000
    optional: true
- runFlow:
    when:
      visible:
        id: push-onboarding-screen
    commands:
      - tapOn: '닫기|Close'
- extendedWaitUntil:
    visible:
      id: whats-new-screen
    timeout: 8000
    optional: true
- runFlow:
    when:
      visible:
        id: whats-new-screen
    commands:
      - tapOn: '닫기|Close'
      - extendedWaitUntil:
          notVisible:
            id: whats-new-screen
          timeout: 10000
# Then: 할 일 탭이 보이고 날씨 설명이 홈 진입을 막지 않는다
- extendedWaitUntil:
    visible: 'To-dos|할 일|Register your location to see the weather|위치를 등록하면 날씨를 볼 수 있어요'
    timeout: 20000
- takeScreenshot: first-home
# 글자 크기 단계 캡처면 로그인 직후 설정 화면에서 고른다(앱 데이터를 지우고 시작하는 흐름마다 초기화되므로 여기서 건다)
- runFlow: font-scale.yaml
