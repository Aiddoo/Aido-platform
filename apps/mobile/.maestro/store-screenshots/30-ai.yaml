appId: com.aido.mobile
name: AI 리포트와 반복 제안
tags:
  - free
  - premium
env:
  QA_SCHEME: ${QA_SCHEME || 'aido-dev'}
onFlowStart:
  - runScript: scripts/lib.js
  - runScript: scripts/screens-setup.js
---
- runFlow: subflows/resume.yaml
- runFlow:
    file: subflows/open.yaml
    env:
      ROUTE: reports
- extendedWaitUntil:
    visible: '.*(AI 리포트|AI reports).*'
    timeout: 20000
- runFlow:
    when:
      true: ${MAESTRO_SHOT_ROLE != 'premium'}
    commands:
      - extendedWaitUntil:
          visible:
            id: report-this-week-record
          timeout: 20000
- takeScreenshot: 30_AI_리포트_목록
- runFlow:
    when:
      true: ${MAESTRO_SHOT_ROLE == 'premium'}
    commands:
      - runFlow:
          file: subflows/open.yaml
          env:
            ROUTE: reports/${MAESTRO_SHOT_WEEKLY_REPORT_ID}
      - extendedWaitUntil:
          visible:
            id: report-summary
          timeout: 20000
      - takeScreenshot: 31_AI_리포트_주간
      - scroll
      - waitForAnimationToEnd:
          timeout: 3000
      - takeScreenshot: 32_AI_리포트_주간_패턴
      - runFlow:
          file: subflows/open.yaml
          env:
            ROUTE: reports/${MAESTRO_SHOT_MONTHLY_REPORT_ID}
      - extendedWaitUntil:
          visible:
            id: report-summary
          timeout: 20000
      - waitForAnimationToEnd:
          timeout: 5000
      - takeScreenshot: 33_AI_리포트_월간
- runFlow:
    file: subflows/open.yaml
    env:
      ROUTE: suggestions
- runFlow:
    when:
      true: ${MAESTRO_SHOT_ROLE == 'premium'}
    commands:
      - extendedWaitUntil:
          visible:
            id: suggestions-status
          timeout: 20000
- runFlow:
    when:
      true: ${MAESTRO_SHOT_ROLE != 'premium'}
    commands:
      - extendedWaitUntil:
          visible: '.*(구독하고 제안 받기|Subscribe to get suggestions).*'
          timeout: 20000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: 34_AI_반복_제안
