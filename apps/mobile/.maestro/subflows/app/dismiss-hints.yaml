appId: ${MAESTRO_APP_ID}
name: 로그인 직후 뜨는 시스템 창과 처음 쓰는 계정 안내를 닫는다
---
- extendedWaitUntil:
    visible: ${output.labels.savePasswordNotNow}
    timeout: 5000
    optional: true
- runFlow:
    label: iOS 암호 저장 제안이 뜨면 저장하지 않는다(시스템 창이라 앱 testID가 없다)
    when:
      visible: ${output.labels.savePasswordNotNow}
    commands:
      - tapOn: ${output.labels.savePasswordNotNow}
- extendedWaitUntil:
    visible:
      id: ${output.ids.notification.onboardingScreen}
    timeout: 5000
    optional: true
- runFlow:
    label: 가입 직후 알림 안내 화면이 뜨면 닫는다(iOS 시뮬레이터는 알림 권한을 미리 줄 수 없어 늘 뜬다)
    when:
      visible:
        id: ${output.ids.notification.onboardingScreen}
    commands:
      - tapOn: ${output.ids.common.headerCloseLabel}
- extendedWaitUntil:
    visible:
      id: ${output.ids.whatsNew.screen}
    timeout: 10000
    optional: true
- runFlow:
    label: 새로운 기능 소개가 자동으로 열리면 닫는다(알림 안내 다음에 피드를 덮고 한 번 뜬다)
    when:
      visible:
        id: ${output.ids.whatsNew.screen}
    commands:
      - tapOn: ${output.ids.common.headerCloseLabel}
      - extendedWaitUntil:
          notVisible:
            id: ${output.ids.whatsNew.screen}
          timeout: 10000
- extendedWaitUntil:
    visible:
      id: ${output.ids.common.hintPopover}
    timeout: 3000
    optional: true
- runFlow:
    label: 기능 안내 말풍선이 떠 있으면 닫는다
    when:
      visible:
        id: ${output.ids.common.hintPopover}
    commands:
      - tapOn:
          id: ${output.ids.common.hintPopoverClose}
