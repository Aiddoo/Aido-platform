appId: ${MAESTRO_APP_ID}
name: 피드의 카테고리에서 할 일 추가 시트를 열고 제목을 쓴다(저장은 부르는 흐름이 한다)
# env: CATEGORY_ID, TODO_TITLE
---
- scrollUntilVisible:
    element:
      id: ${output.ids.todo.addButton(CATEGORY_ID)}
- tapOn:
    id: ${output.ids.todo.addButton(CATEGORY_ID)}
- extendedWaitUntil:
    visible:
      id: ${output.ids.todo.addSheet}
    timeout: 10000
- tapOn:
    id: ${output.ids.todo.titleInput}
- inputText: ${TODO_TITLE}
