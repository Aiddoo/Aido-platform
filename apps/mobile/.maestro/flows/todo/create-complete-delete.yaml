appId: ${MAESTRO_APP_ID}
name: 할 일을 추가하고 완료한 뒤 지운다
tags:
  - smoke
  - todo
onFlowStart:
  - runFlow: ../../subflows/app/load-helpers.yaml
  - evalScript: ${output.main = output.api.signIn('main')}
  - evalScript: ${output.main.removeE2eCategories()}
  - evalScript: ${output.category = output.main.createCategory('todo ' + output.config.runId)}
  - evalScript: ${output.todoTitle = 'E2E todo ' + output.config.runId}
  - runFlow: ../../subflows/app/launch-fresh.yaml
onFlowComplete:
  - evalScript: ${output.main && output.main.removeE2eCategories()}
---
# Given: 테스트 카테고리가 있는 계정으로 로그인했다
- runFlow:
    file: ../../subflows/auth/sign-in.yaml
    env:
      EMAIL: ${output.main.email}
      PASSWORD: ${output.main.password}

# When: 그 카테고리에 할 일을 추가한다
- runFlow:
    file: ../../subflows/todo/create.yaml
    env:
      CATEGORY_ID: ${output.category.id}
      TODO_TITLE: ${output.todoTitle}
# Then: 서버에 완료하지 않은 할 일로 저장된다
- evalScript: ${output.todo = output.main.waitForTodo(output.category.id, output.todoTitle, false)}

# When: 체크박스를 누른다
- tapOn:
    id: ${output.ids.todo.checkbox(output.todo.id)}
# Then: 서버에서도 완료로 바뀐다
- evalScript: ${output.main.waitForTodo(output.category.id, output.todoTitle, true)}

# When: 더보기에서 지운다
- runFlow:
    file: ../../subflows/todo/delete.yaml
    env:
      TODO_ID: ${output.todo.id}
      TODO_TITLE: ${output.todoTitle}
# Then: 서버에서도 사라진다
- evalScript: ${output.main.waitForTodoGone(output.category.id, output.todoTitle)}
