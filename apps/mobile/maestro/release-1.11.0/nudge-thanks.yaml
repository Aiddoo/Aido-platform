appId: com.aido.mobile
name: 할 일을 직접 완료한 뒤 친구에게 감사를 한 번만 전한다
---
# Given: 친구가 콕을 보낸 미완료 할 일
- openLink: aido-dev://feed?date=today
- extendedWaitUntil:
    visible: ${QA_TODO_TITLE}
    timeout: 15000
- scrollUntilVisible:
    element:
      id: todo-checkbox-${QA_TODO_ID}
    direction: DOWN
    centerElement: true
# When: 할 일을 완료하고 감사할 친구를 확인한다
- tapOn:
    id: todo-checkbox-${QA_TODO_ID}
- waitForAnimationToEnd:
    timeout: 3000
- openLink: aido-dev://nudges/${QA_NUDGE_ID}
- extendedWaitUntil:
    visible: '완료한 할 일이에요|This to-do is complete'
    timeout: 15000
- scrollUntilVisible:
    element: '친구에게 고마움 전하기|Thank the friends who cheered you on'
    direction: DOWN
    centerElement: true
- tapOn: '친구에게 고마움 전하기|Thank the friends who cheered you on'
- extendedWaitUntil:
    visible: '친구에게 고마움을 전해요|A thank-you for being there'
    timeout: 15000
- assertVisible: ${QA_FRIEND_NAME}
- takeScreenshot: 1.11.0-thanks-preview
- tapOn: '1명에게 고마움 전하기|Thank 1 friend'
# Then: 시트 안에서 성공을 확인한 뒤 완료 버튼으로 닫는다
- extendedWaitUntil:
    visible: '친구에게 고마운 마음을 전했어요|Your thanks are on their way'
    timeout: 15000
- takeScreenshot: 1.11.0-thanks-sent
- tapOn: '완료|Done'
- assertNotVisible: '친구에게 고마움을 전해요|A thank-you for being there'
