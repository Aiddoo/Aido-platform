appId: com.aido.mobile
name: 화면 전환이 완료된 한글 라이트 UI를 캡처한다
---
# Given: 한글 모드에서 정상 로그인된 QA 계정
- openLink: aido-dev://settings/theme
- extendedWaitUntil:
    visible: 라이트 모드
    timeout: 15000
- tapOn: 라이트 모드
# When: 라이트 모드의 각 기능 화면을 연다
- openLink: aido-dev://nudges?direction=received
- extendedWaitUntil:
    visible: 받은 콕
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: 01-received-light
- tapOn: 보낸 콕
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: 02-sent-light
- openLink: aido-dev://nudges/${QA_NUDGE_ID}
- extendedWaitUntil:
    visible: 친구의 응원
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: 03-reply-light
- openLink: aido-dev://todo/${QA_TODO_ID}
- extendedWaitUntil:
    visible: 할 일 상세
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: 05-todo-light
- openLink: aido-dev://feed?date=today
- extendedWaitUntil:
    visible: 할 일
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 5000
# Then: 기존 홈 레이아웃에서 한글 텍스트와 탭을 확인한다
- takeScreenshot: 15-home-light
