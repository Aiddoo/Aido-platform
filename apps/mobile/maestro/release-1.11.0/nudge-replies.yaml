appId: com.aido.mobile
name: 콕에 세 가지 답장을 보내도 할 일은 자동 완료되지 않는다
---
# Given: 현재 친구가 오늘의 공개 할 일에 보낸 콕
- openLink: aido-dev://nudges/${QA_NUDGE_ID}
- extendedWaitUntil:
    visible: '지금 내 마음을 알려주세요|Let your friend know how you feel'
    timeout: 20000
- assertVisible: ${QA_TODO_TITLE}
# When: 답장을 보내고 다른 답장으로 변경한다
- tapOn: '시작해볼게|I’ll get started'
- extendedWaitUntil:
    visible: '답장을 바꿔도 알림은 한 번만 전해져요|Changing your reply won’t send another notification'
    timeout: 15000
- tapOn: '응원 고마워|Thanks for the cheer'
- waitForAnimationToEnd:
    timeout: 3000
- tapOn: '조금 뒤에 할게|I’ll do it a little later'
- waitForAnimationToEnd:
    timeout: 3000
# Then: 완료 표시 없이 직접 할 일을 열 수 있다
- assertNotVisible: '완료한 할 일이에요|This to-do is complete'
- assertVisible: '할 일 보기|View to-do'
- takeScreenshot: 1.11.0-nudge-replies
- tapOn: '할 일 보기|View to-do'
- extendedWaitUntil:
    visible: ${QA_TODO_TITLE}
    timeout: 15000
- takeScreenshot: 1.11.0-nudge-todo
