appId: com.aido.mobile
name: 받은 콕·답장·할 일 이동·감사 시트의 한글 라이트 화면을 검증한다
---
# Given: 한글 모드의 무료 QA 계정과 유료 친구가 보낸 새 콕
- openLink: aido-dev://settings/theme
- extendedWaitUntil:
    visible: 라이트 모드
    timeout: 15000
- tapOn: 라이트 모드
- openLink: aido-dev://nudges?direction=received
- extendedWaitUntil:
    visible: 알림
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: 01-notification-inbox-light
- tapOn: 보낸 콕
- extendedWaitUntil:
    visible: 보낸 콕
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: 02-sent-light
- openLink: aido-dev://notifications?category=SOCIAL
- openLink: aido-dev://nudges/${QA_NUDGE_ID}
- extendedWaitUntil:
    visible: 친구에게 한마디 전해볼까요?
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: 03-reply-light
# When: 콕에 답장한 뒤 할 일로 이동하고 다시 돌아온다
- tapOn: 시작해볼게
- extendedWaitUntil:
    visible: 답장을 바꿔도 친구에게 알림이 또 가지 않아요
    timeout: 15000
- tapOn: 응원 고마워
- tapOn: 조금 뒤에 할게
- assertNotVisible: .*완료한 할 일이에요.*
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: 04-replied-light
- tapOn: .*할 ?일 보기.*
- extendedWaitUntil:
    visible: ${QA_TODO_TITLE}
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: 05-todo-light
- waitForAnimationToEnd:
    timeout: 5000
- runFlow:
    when:
      platform: Android
    commands:
      - tapOn: 뒤로 ?가기
- runFlow:
    when:
      platform: iOS
    commands:
      - swipe:
          start: 1%, 45%
          end: 85%, 45%
          duration: 600
- extendedWaitUntil:
    visible: 친구에게 한마디 전해볼까요?
    timeout: 15000
# When: 앱에서 직접 완료하고 감사할 친구를 확인한다
- openLink: aido-dev://feed?date=today
- scrollUntilVisible:
    element:
      id: todo-checkbox-${QA_TODO_ID}
    direction: DOWN
    centerElement: true
- tapOn:
    id: todo-checkbox-${QA_TODO_ID}
- openLink: aido-dev://nudges/${QA_NUDGE_ID}
- extendedWaitUntil:
    visible: .*완료한 할 일이에요.*
    timeout: 15000
- scrollUntilVisible:
    element: 친구에게 고마움 전하기
    direction: DOWN
    centerElement: true
- tapOn: 친구에게 고마움 전하기
- extendedWaitUntil:
    visible: 친구에게 고마움을 전해요
    timeout: 15000
- assertVisible: ${QA_FRIEND_NAME}
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: 06-thanks-sheet-light
# Then: Android 시스템 뒤로가기는 시트만 닫고 현재 상세를 보존한다
- runFlow:
    when:
      platform: Android
    commands:
      - back
      - waitForAnimationToEnd
      - assertNotVisible: 친구에게 고마움을 전해요
      - assertVisible: 친구의 응원
      - tapOn: 친구에게 고마움 전하기
      - extendedWaitUntil:
          visible: 친구에게 고마움을 전해요
          timeout: 15000
# Then: 화면을 바꾸면 기존 감사 시트가 새 화면 위에 남지 않는다
- openLink: aido-dev://nudges?direction=received
- extendedWaitUntil:
    visible: 알림
    timeout: 15000
- assertNotVisible: 친구에게 고마움을 전해요
- openLink: aido-dev://nudges/${QA_NUDGE_ID}
- scrollUntilVisible:
    element: 친구에게 고마움 전하기
    direction: DOWN
    centerElement: true
- tapOn: 친구에게 고마움 전하기
- extendedWaitUntil:
    visible: 친구에게 고마움을 전해요
    timeout: 15000
- tapOn: 1명에게 고마움 전하기
- extendedWaitUntil:
    visible: 친구에게 고마운 마음을 전했어요
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: 07-thanked-light
- tapOn: 완료
- assertNotVisible: 친구에게 고마움을 전해요
- assertVisible: 완료 소식과 고마운 마음을 전했어요
