appId: com.aido.mobile
name: 받은 콕·답장·할 일 이동·감사 시트의 한글 라이트 화면을 검증한다
---
# Given: 한글 모드의 무료 QA 계정과 유료 친구가 보낸 새 콕
- openLink: aido-dev://settings/theme
- extendedWaitUntil:
    visible: 라이트 모드
    timeout: 15000
- tapOn: 라이트 모드
- openLink: aido-dev://nudges?direction=received
- extendedWaitUntil:
    visible: 받은 콕
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: 01-received-light
- tapOn: 보낸 콕
- extendedWaitUntil:
    visible: 보낸 콕
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: 02-sent-light
- tapOn: 받은 콕
- openLink: aido-dev://nudges/${QA_NUDGE_ID}
- extendedWaitUntil:
    visible: 지금 내 마음을 알려주세요
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: 03-reply-light
# When: 콕에 답장한 뒤 할 일로 이동하고 다시 돌아온다
- tapOn: 시작해볼게
- extendedWaitUntil:
    visible: 답장을 바꿔도 알림은 한 번만 전해져요
    timeout: 15000
- tapOn: 응원 고마워
- tapOn: 조금 뒤에 할게
- assertNotVisible: 완료한 할 일이에요
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: 04-replied-light
- tapOn: 할 일 보기
- extendedWaitUntil:
    visible: ${QA_TODO_TITLE}
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: 05-todo-light
- waitForAnimationToEnd:
    timeout: 5000
- runFlow:
    when:
      platform: Android
    commands:
      - tapOn: 뒤로 ?가기
- runFlow:
    when:
      platform: iOS
    commands:
      - swipe:
          start: 1%, 45%
          end: 85%, 45%
          duration: 600
- extendedWaitUntil:
    visible: 지금 내 마음을 알려주세요
    timeout: 15000
# When: 앱에서 직접 완료하고 감사할 친구를 확인한다
- openLink: aido-dev://feed?date=today
- scrollUntilVisible:
    element:
      id: todo-checkbox-${QA_TODO_ID}
    direction: DOWN
    centerElement: true
- tapOn:
    id: todo-checkbox-${QA_TODO_ID}
- openLink: aido-dev://nudges/${QA_NUDGE_ID}
- extendedWaitUntil:
    visible: 완료한 할 일이에요
    timeout: 15000
- scrollUntilVisible:
    element: 응원해 준 친구에게 감사 보내기
    direction: DOWN
    centerElement: true
- tapOn: 응원해 준 친구에게 감사 보내기
- extendedWaitUntil:
    visible: 감사 전하기
    timeout: 15000
- assertVisible: ${QA_FRIEND_NAME}
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: 06-thanks-sheet-light
# Then: Android 시스템 뒤로가기는 시트만 닫고 현재 상세를 보존한다
- runFlow:
    when:
      platform: Android
    commands:
      - back
      - assertNotVisible: 감사 전하기
      - assertVisible: 친구의 응원
      - tapOn: 응원해 준 친구에게 감사 보내기
      - extendedWaitUntil:
          visible: 감사 전하기
          timeout: 15000
# Then: 화면을 바꾸면 기존 감사 시트가 새 화면 위에 남지 않는다
- openLink: aido-dev://nudges?direction=received
- extendedWaitUntil:
    visible: 받은 콕
    timeout: 15000
- assertNotVisible: 감사 전하기
- openLink: aido-dev://nudges/${QA_NUDGE_ID}
- scrollUntilVisible:
    element: 응원해 준 친구에게 감사 보내기
    direction: DOWN
    centerElement: true
- tapOn: 응원해 준 친구에게 감사 보내기
- extendedWaitUntil:
    visible: 감사 전하기
    timeout: 15000
- tapOn: 감사 전하기
- extendedWaitUntil:
    visible: 완료 소식과 감사를 전했어요
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: 07-thanked-light
