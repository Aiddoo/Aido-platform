appId: com.aido.mobile
name: 이전 흐름의 로그인 상태로 앱을 이어서 연다
---
# 앞선 흐름이 로그인해 둔 상태를 쓴다. 로그인 화면이면(첫 흐름이 실패했거나 단독 실행) 캡처 계정으로 다시 로그인한다
- launchApp:
    stopApp: false
- runFlow:
    when:
      visible: '이메일로 로그인|Sign in with email'
    file: start.yaml
    env:
      QA_EMAIL: ${MAESTRO_SHOT_EMAIL}
      QA_PASSWORD: ${MAESTRO_SHOT_PASSWORD}
- runFlow: settle.yaml
