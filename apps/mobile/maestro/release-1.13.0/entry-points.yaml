appId: com.aido.mobile
name: 친구 빈 상태, 마이페이지, 새 소식에서 초대 화면으로 들어간다
tags:
  - full
  - base
env:
  QA_SCHEME: ${QA_SCHEME || 'aido-dev'}
onFlowStart:
  - runScript: scripts/lib.js
  - runScript: scripts/setup.js
  - runFlow: subflows/fresh-start.yaml
---
# Given: 친구가 없는 B (reset 직후)
- runFlow: subflows/login-invitee.yaml
# 1) 친구 빈 상태 CTA
- openLink: ${QA_SCHEME}://friends
- extendedWaitUntil:
    visible: '아직 친구가 없어요|No friends yet'
    timeout: 20000
- assertVisible:
    id: friends-empty-invite
- takeScreenshot: 1.13.0-entry-friends-empty
- tapOn:
    id: friends-empty-invite
- extendedWaitUntil:
    visible: '내 초대 코드|My invite code'
    timeout: 15000
# 2) 마이페이지 초대 카드
- openLink: ${QA_SCHEME}://mypage
- extendedWaitUntil:
    visible:
      id: mypage-invite-card
    timeout: 20000
- takeScreenshot: 1.13.0-entry-mypage
- tapOn:
    id: mypage-invite-card
- extendedWaitUntil:
    visible: '내 초대 코드|My invite code'
    timeout: 15000
# 3) 새 소식(1.14.0 친구 초대 안내)
- openLink: ${QA_SCHEME}://mypage
- extendedWaitUntil:
    visible:
      id: whats-new-open
    timeout: 20000
- tapOn:
    id: whats-new-open
- extendedWaitUntil:
    visible:
      id: whats-new-release-1.14.0
    timeout: 10000
- tapOn:
    id: whats-new-release-1.14.0
- extendedWaitUntil:
    visible:
      id: whats-new-step-action
    timeout: 10000
- takeScreenshot: 1.13.0-entry-whats-new
- tapOn:
    id: whats-new-step-action
- extendedWaitUntil:
    visible: '내 초대 코드|My invite code'
    timeout: 15000
