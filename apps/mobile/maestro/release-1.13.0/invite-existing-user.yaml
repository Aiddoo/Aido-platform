appId: com.aido.mobile
name: 로그인된 기존 사용자가 초대 링크를 열면 친구 맺기만 한다
tags:
  - full
env:
  QA_SCHEME: aido-dev
  QA_INVITE_CODE: ''
---
- runFlow: subflows/resolve-invite-code.yaml
# Given: 이미 쓰던 기존 계정(초대자와 아직 친구가 아님)으로 로그인
- runFlow:
    file: subflows/sign-in.yaml
    env:
      QA_EMAIL: ${QA_EXISTING_EMAIL}
      QA_PASSWORD: ${QA_EXISTING_PASSWORD}
- openLink: ${QA_SCHEME}://invite/${output.inviteCode}
# Then: 보상 안내 없이 친구 맺기만 안내한다
- extendedWaitUntil:
    visible: '${QA_INVITER_NAME}님이 아이두에.*|${QA_INVITER_NAME} invited you.*'
    timeout: 20000
- assertVisible: '이미 아이두를 쓰고 있어서 바로 친구가 돼요.*|You already use Aido.*'
- assertNotVisible: '가입하고 친구 되기|Join and become friends'
- takeScreenshot: 1.13.0-invite-existing-user-card
# When: 친구 맺기를 누른다
- tapOn: '${QA_INVITER_NAME}님과 친구 맺기|Become friends with ${QA_INVITER_NAME}'
# Then: 친구만 맺었다는 환영 시트가 보이고 프리미엄 보상은 없다
- extendedWaitUntil:
    visible: '${QA_INVITER_NAME}님과 친구가 됐어요|You.re now friends with ${QA_INVITER_NAME}|${QA_INVITER_NAME}님에게 친구 요청을 보냈어요|Friend request sent to ${QA_INVITER_NAME}'
    timeout: 20000
- assertNotVisible: '프리미엄 .*일을 받았어요|You got .* of Premium'
- assertNotVisible: '.*문제가 발생했어요.*|.*Something went wrong.*'
- takeScreenshot: 1.13.0-invite-existing-user-welcome
- tapOn: '나중에 할게요|Maybe later'
